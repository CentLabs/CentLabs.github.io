<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 价格比较 · JayDreamy AI Portal</title>
<meta name="description" content="ChatGPT、Claude、Gemini、Grok 及国内 AI 产品的订阅价格、API 计费、图片视频生成价格与免费额度统一对比。">
<meta name="keywords" content="AI价格,AI订阅,ChatGPT价格,Claude价格,API计费,免费额度,大模型价格">
<link rel="canonical" href="https://www.jaydreamy.com/ai/pricing/">
<meta property="og:type" content="website">
<meta property="og:title" content="AI 价格比较 · JayDreamy AI Portal">
<meta property="og:description" content="订阅、API、图片视频生成价格与免费额度统一对比。">
<meta property="og:url" content="https://www.jaydreamy.com/ai/pricing/">
<link rel="icon" type="image/svg+xml" href="/ai/assets/images/favicon.svg">
<link rel="stylesheet" href="/ai/assets/css/portal.css">
</head>
<body data-page="pricing">

<nav class="ai-nav">
  <div class="ai-nav-inner ai-container">
    <a class="ai-nav-brand" href="/ai/"><span class="logo">AI</span><span>AI Portal <span class="sub">JayDreamy</span></span></a>
    <button class="ai-nav-toggle" id="aiNavToggle" aria-label="菜单">☰</button>
    <div class="ai-nav-links" id="aiNavLinks">
      <a href="/ai/models/">模型</a>
      <a href="/ai/tools/">工具</a>
      <a href="/ai/agents/">Agent</a>
      <a href="/ai/coding/">编程</a>
      <a href="/ai/knowledge/">知识库</a>
      <a href="/ai/pricing/">价格</a>
      <a href="/ai/prompts/">提示词</a>
      <a href="/ai/news/">资讯</a>
      <a href="/" class="ai-nav-home">返回主站</a>
    </div>
  </div>
</nav>

<header class="ai-page-head ai-container">
  <div class="crumb"><a href="/ai/">AI Portal</a> / 价格</div>
  <h1>AI 价格比较</h1>
  <p class="sub" id="pricingDisclaimer">价格以各厂商官方定价页为准，核实日期见每条数据。订阅价格可能因地区、税费与促销活动而变化。</p>
</header>

<main class="ai-container ai-section">
  <section>
    <h2 class="ai-section-title" style="margin-bottom:16px"><span class="ico">💳</span>订阅价格</h2>
    <div class="ai-grid cols-3" id="subsGrid">
      <div class="ai-loading"><div class="spinner"></div></div>
    </div>
  </section>

  <section class="ai-section">
    <h2 class="ai-section-title" style="margin-bottom:16px"><span class="ico">⚡</span>API 计费（每 1M tokens）</h2>
    <div class="ai-table-wrap">
      <table class="ai-table">
        <thead>
          <tr><th>产品</th><th>厂商</th><th>输入价格</th><th>输出价格</th><th>货币</th><th>上下文</th><th>免费额度</th><th>核实日期</th></tr>
        </thead>
        <tbody id="apiTable">
          <tr><td colspan="8"><div class="ai-loading"><div class="spinner"></div></div></td></tr>
        </tbody>
      </table>
    </div>
  </section>

  <section class="ai-section">
    <h2 class="ai-section-title" style="margin-bottom:16px"><span class="ico">🎨</span>图片 / 视频生成</h2>
    <div class="ai-grid cols-4" id="imgGrid">
      <div class="ai-loading"><div class="spinner"></div></div>
    </div>
  </section>
</main>

<footer class="ai-footer">
  <div class="ai-footer-bottom ai-container">
    <span>© 2026 JayDreamy · CentLabs</span>
    <span>价格以官方定价页为准</span>
  </div>
</footer>

<script src="/ai/assets/js/portal.js"></script>
<script>
window.AI_PAGE = window.AI_PAGE || {};
window.AI_PAGE.pricing = {
  init: function () {
    var AI = window.AI;
    AI.fetchJSON('/ai/data/pricing.json').then(function (data) {
      // 订阅
      var subs = data.subscriptions || [];
      AI.renderGrid('subsGrid', subs, function (s) {
        var tiers = s.tiers.map(function (t) {
          return '<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-size:13.5px">' +
            '<span style="font-weight:600;color:#fff">' + AI.esc(t.name) + '</span>' +
            '<span style="color:var(--cyan)">' + AI.esc(t.price) + '</span>' +
            '</div>' +
            '<div style="font-size:12px;color:var(--txt-faint);padding:3px 0 8px">' + AI.esc(t.note) + '</div>';
        }).join('');
        return '<div class="ai-card">' +
          '<div class="glow"></div>' +
          '<div class="ai-card-ico">💳</div>' +
          '<h3>' + AI.esc(s.product) + '</h3>' +
          '<div class="desc" style="margin-bottom:10px">' + AI.esc(s.vendor) + '</div>' +
          tiers +
          '<div class="ai-tags" style="margin-top:10px"><span class="ai-tag new">核实：' + AI.esc(s.last_verified || '') + '</span>' +
          '<a class="ai-tag hot" href="' + AI.esc(s.source_url) + '" target="_blank" rel="noopener">官方 ↗</a></div>' +
          '</div>';
      });

      // API 表格
      var apis = data.api_pricing || [];
      var tb = document.getElementById('apiTable');
      tb.innerHTML = apis.map(function (a) {
        return '<tr>' +
          '<td class="name-cell">' + AI.esc(a.product) + '</td>' +
          '<td class="vendor">' + AI.esc(a.vendor) + '</td>' +
          '<td class="price">' + AI.esc(a.price_input) + '</td>' +
          '<td class="price">' + AI.esc(a.price_output) + '</td>' +
          '<td>' + AI.esc(a.currency) + '</td>' +
          '<td>' + AI.esc(a.context || '—') + '</td>' +
          '<td>' + AI.esc(a.free_quota || '—') + '</td>' +
          '<td>' + AI.esc(a.last_verified || '') + '</td>' +
          '</tr>';
      }).join('');

      // 图片视频
      var img = data.image_video || [];
      AI.renderGrid('imgGrid', img, function (i) {
        return '<div class="ai-card">' +
          '<div class="ai-card-ico">🎨</div>' +
          '<h3>' + AI.esc(i.product) + '</h3>' +
          '<div class="desc">' + AI.esc(i.vendor) + '</div>' +
          '<div class="ai-tags" style="margin-top:10px"><span class="ai-tag new">' + AI.esc(i.pricing) + '</span></div>' +
          '</div>';
      });
    });
  }
};
</script>
</body>
</html>
