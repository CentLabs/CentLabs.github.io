<script src="assets/study-tools.js"></script>
<script>
(function(){
'use strict';
var esc=KB.esc;
var CAT_NAME={politics:'政治',english:'英语',mathematics:'数学','computer-408':'计算机408'};
var CAT_COLOR={politics:'var(--pol)',english:'var(--eng)',mathematics:'var(--math)','computer-408':'var(--cs)'};
var root=document.getElementById('card-root');
var q=new URLSearchParams(location.search);
var id=q.get('id')||'';

function field(cls,label,arr){
  if(!arr||!arr.length)return '';
  return '<div class="kp-field '+cls+'"><b>'+label+'</b><ul>'+arr.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul></div>';
}
function navLink(k,dir){
  return k?'<a class="kb-btn" href="card.html?id='+k.id+'">'+(dir==='prev'?'← 上一个':'下一个 →')+'</a>':'<span class="kb-btn" style="opacity:.4;cursor:not-allowed">'+(dir==='prev'?'← 上一个':'下一个 →')+'</span>';
}
function render(k,all,idx){
  document.title=k.name+' · 27 考研知识库';
  document.getElementById('crumb-name').textContent=k.name.slice(0,30);
  var prev=idx>0?all[idx-1]:null, next=idx<all.length-1?all[idx+1]:null;
  var html='<div class="kb-note" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">'+
    '<span>'+navLink(prev,'prev')+'</span>'+
    '<span style="color:var(--text-3)">'+esc(k.category)+' · 第 '+(idx+1)+' / '+all.length+' 张</span>'+
    '<span>'+navLink(next,'next')+'</span></div>';
  html+='<div class="kb-card" style="cursor:default">'+
    '<div class="kb-tags"><span class="kb-tag cat" style="--cat:'+CAT_COLOR[k.category_id]+'">'+esc(k.category)+'</span>'+
    '<span class="kb-tag">'+esc(k.source||'')+'</span>'+
    '<span class="kb-tag" id="favBtn" style="cursor:pointer">☆ 收藏</span>'+
    '<span class="kb-tag" id="linkBtn" style="cursor:pointer">🔗 复制链接</span>'+
    '<a class="kb-tag" href="study.html#/points" style="cursor:pointer">↩ 返回列表</a></div>'+
    '<h2 style="margin:10px 0 4px;font-size:22px;line-height:1.4">'+esc(k.name)+'</h2>'+
    '<div class="kb-ai-hint"><button class="kb-btn" id="aiExplain">🤖 AI 解释</button><span class="kb-tag warn">即将接入 · 结果与原始资料严格区分</span></div>'+
    field('','定义',k.definition)+field('','核心要点',k.points)+field('traps','易错点',k.traps)+
    field('formula','公式 / 代码',k.formula)+field('','相关知识点',k.related)+field('','来源参考',k.source_ref)+
    '</div>';
  root.innerHTML=html;
  KB.renderMath(root);
  /* 收藏 */
  if(window.StudyTools){
    var st=window.StudyTools, favEl=document.getElementById('favBtn');
    var refresh=function(){favEl.textContent=st.isFav(k.id)?'★ 已收藏':'☆ 收藏';};
    refresh();
    favEl.onclick=function(){st.toggleFav(k.id,'point',k.name);refresh();};
  }
  /* 复制链接 */
  document.getElementById('linkBtn').onclick=function(){
    var url=location.origin+location.pathname+'?id='+k.id;
    var done=function(){linkBtn.textContent='✓ 已复制';setTimeout(function(){linkBtn.textContent='🔗 复制链接';},1500);};
    var linkBtn=document.getElementById('linkBtn');
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(url).then(done).catch(function(){fb(url);done();});}
    else{fb(url);done();}
  };
  function fb(t){var ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();}
  document.getElementById('aiExplain').onclick=function(){this.nextElementSibling.textContent='「AI 解释」功能即将接入，当前请以原始资料为准';};
}
function renderNotFound(){
  root.innerHTML='<div class="kb-empty"><div style="font-size:40px;margin-bottom:12px">🔍</div><h3>未找到该知识点</h3>'+
    '<p>知识点 ID 无效或已被移除。</p>'+
    '<a class="kb-btn primary" href="study.html#/points">浏览全部知识点</a> <a class="kb-btn" href="index.html">返回首页</a></div>';
}
fetch('data/knowledge-points.json').then(function(r){return r.json();}).then(function(all){
  if(!id){renderNotFound();return;}
  var idx=all.findIndex(function(k){return k.id===id;});
  if(idx<0){renderNotFound();return;}
  render(all[idx],all,idx);
}).catch(function(e){root.innerHTML='<div class="kb-empty">数据加载失败：'+esc(e.message)+'</div>';});
})();
</script>
</body></html>
