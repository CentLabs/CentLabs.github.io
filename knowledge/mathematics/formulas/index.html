<script>window.__FORMULAS__ = [{"id": "limit-001", "subject": "higher-mathematics", "subjectName": "高等数学", "subjectColor": "#0f6e56", "chapter": "函数、极限、连续", "name": "第一个重要极限", "category": "公式", "importance": 5, "tags": ["极限", "重要极限", "三角函数"], "latex": "\\lim_{x\\to 0}\\frac{\\sin x}{x}=1", "summary": "当 x 趋于 0 时，sin x 与 x 是等价无穷小，其比值极限为 1。"}, {"id": "limit-002", "subject": "higher-mathematics", "subjectName": "高等数学", "subjectColor": "#0f6e56", "chapter": "函数、极限、连续", "name": "第二个重要极限", "category": "公式", "importance": 5, "tags": ["极限", "重要极限", "e"], "latex": "\\lim_{x\\to\\infty}\\left(1+\\frac{1}{x}\\right)^{x}=e", "summary": "底数趋于 1、指数趋于无穷的 1^∞ 型极限，结果是自然常数 e。"}, {"id": "limit-003", "subject": "higher-mathematics", "subjectName": "高等数学", "subjectColor": "#0f6e56", "chapter": "函数、极限、连续", "name": "夹逼准则", "category": "定理", "importance": 4, "tags": ["极限", "夹逼准则", "极限存在准则"], "latex": "g(x)\\le f(x)\\le h(x),\\ \\lim g(x)=\\lim h(x)=A\\ \\Rightarrow\\ \\lim f(x)=A", "summary": "若函数被夹在两个趋于同一极限的函数之间，则它也趋于该极限。"}, {"id": "limit-004", "subject": "higher-mathematics", "subjectName": "高等数学", "subjectColor": "#0f6e56", "chapter": "函数、极限、连续", "name": "等价无穷小替换定理", "category": "定义", "importance": 5, "tags": ["极限", "等价无穷小", "无穷小替换"], "latex": "\\alpha(x)\\sim\\alpha_1(x),\\ \\beta(x)\\sim\\beta_1(x)\\ \\Rightarrow\\ \\lim\\frac{\\alpha(x)}{\\beta(x)}=\\lim\\frac{\\alpha_1(x)}{\\beta_1(x)}", "summary": "求极限时，分子分母中的无穷小因子可用其等价无穷小替换。"}, {"id": "limit-005", "subject": "higher-mathematics", "subjectName": "高等数学", "subjectColor": "#0f6e56", "chapter": "函数、极限、连续", "name": "零点定理", "category": "定理", "importance": 4, "tags": ["连续", "零点定理", "介值定理"], "latex": "f(a)\\cdot f(b)<0\\ \\Rightarrow\\ \\exists\\,\\xi\\in(a,b),\\ f(\\xi)=0", "summary": "闭区间上连续函数两端异号，则区间内必存在零点。"}, {"id": "limit-006", "subject": "higher-mathematics", "subjectName": "高等数学", "subjectColor": "#0f6e56", "chapter": "函数、极限、连续", "name": "数列极限的定义", "category": "定义", "importance": 4, "tags": ["极限", "数列", "ε-N"], "latex": "\\lim_{n\\to\\infty}x_n=A\\iff\\forall\\varepsilon>0,\\ \\exists N\\in\\mathbb{N},\\ n>N\\Rightarrow|x_n-A|<\\varepsilon", "summary": "数列 {xₙ} 收敛于常数 A 的 ε-N 定义：任意给定 ε>0，存在正整数 N，使得 n>N 时恒有 |xₙ−A|<ε。"}, {"id": "limit-007", "subject": "higher-mathematics", "subjectName": "高等数学", "subjectColor": "#0f6e56", "chapter": "函数、极限、连续", "name": "函数在无穷远处的极限", "category": "定义", "importance": 3, "tags": ["极限", "无穷远", "ε-X"], "latex": "\\lim_{x\\to\\infty}f(x)=A\\iff\\forall\\varepsilon>0,\\ \\exists X>0,\\ |x|>X\\Rightarrow|f(x)-A|<\\varepsilon", "summary": "当 |x| 充分大时 f(x) 与 A 的距离可任意小，称 f(x) 在 x→∞ 时以 A 为极限。"}, {"id": "limit-008", "subject": "higher-mathematics", "subjectName": "高等数学", "subjectColor": "#0f6e56", "chapter": "函数、极限、连续", "name": "函数在有限点处的极限", "category": "定义", "importance": 4, "tags": ["极限", "ε-δ", "定义"], "latex": "\\lim_{x\\to x_0}f(x)=A\\iff\\forall\\varepsilon>0,\\ \\exists\\delta>0,\\ 0<|x-x_0|<\\delta\\Rightarrow|f(x)-A|<\\varepsilon", "summary": "函数极限的 ε-δ 定义。注意 0<|x−x₀| 表明极限与 f(x) 在 x₀ 处的取值无关。"}, {"id": "limit-009", "subject": "higher-mathematics", "subjectName": "高等数学", "subjectColor": "#0f6e56", "chapter": "函数、极限、连续", "name": "极限的唯一性与局部有界性", "category": "性质", "importance": 3, "tags": ["极限", "有界性", "唯一性"], "latex": "\\lim_{x\\to x_0}f(x)=A\\Rightarrow\\exists\\delta>0,\\ M>0:\\ |f(x)|\\le M\\quad(0<|x-x_0|<\\delta)", "summary": "若极限存在，则函数在该点的某去心邻域内有界（局部有界性）；且极限值唯一。"}, {"id": "limit-010", "subject": "higher-mathematics", "subjectName": "高等数学", "subjectColor": "#0f6e56", "chapter": "函数、极限、连续", "name": "极限的局部保号性", "category": "性质", "importance": 4, "tags": ["极限", "保号性"], "latex": "\\lim_{x\\to x_0}f(x)=A>0\\Rightarrow\\exists\\delta>0:\\ f(x)>0\\quad(0<|x-x_0|<\\delta)", "summary": "若函数极限为正（负），则在 x₀ 的某去心邻域内函数值保持同号；反之由 f(x)≥0 可得 A≥0。"}, {"id": "limit-011", "subject": "higher-mathematics", "subjectName": "高等数学", "subjectColor": "#0f6e56", "chapter": "函数、极限、连续", "name": "单调有界准则", "category": "定理", "importance": 4, "tags": ["极限", "存在准则", "数列"], "latex": "x_n\\le x_{n+1},\\ x_n\\le M\\ \\Rightarrow\\ \\lim_{n\\to\\infty}x_n=L", "summary": "单调增加且有上界（或单调减少且有下界）的数列必有极限。这是原书列出的两个极限存在准则之一。"}, {"id": "limit-012", "subject": "higher-mathematics", "subjectName": "高等数学", "subjectColor": "#0f6e56", "chapter": "函数、极限、连续", "name": "极限的四则运算法则", "category": "法则", "importance": 5, "tags": ["极限", "四则运算"], "latex": "\\lim[f(x)\\pm g(x)]=A\\pm B,\\quad\\lim[f(x)g(x)]=AB,\\quad\\lim\\frac{f(x)}{g(x)}=\\frac{A}{B}\\ (B\\neq0)", "summary": "设 lim f(x)=A、lim g(x)=B，则和差积商的极限等于极限的和差积商。"}, {"id": "limit-013", "subject": "higher-mathematics", "subjectName": "高等数学", "subjectColor": "#0f6e56", "chapter": "函数、极限、连续", "name": "极限运算的常用结论（有理分式）", "category": "法则", "importance": 4, "tags": ["极限", "有理分式", "无穷远"], "latex": "\\lim_{x\\to\\infty}\\frac{a_0x^n+a_1x^{n-1}+\\cdots+a_n}{b_0x^m+b_1x^{m-1}+\\cdots+b_m}=\\begin{cases}0,&n<m\\\\\\frac{a_0}{b_0},&n=m\\\\\\infty,&n>m\\end{cases}", "summary": "原书在极限运算法则后列出的特殊情形结论：有理分式在无穷远处的极限由分子分母最高次幂决定。"}, {"id": "limit-014", "subject": "higher-mathematics", "subjectName": "高等数学", "subjectColor": "#0f6e56", "chapter": "函数、极限、连续", "name": "无穷小量与极限的关系", "category": "定理", "importance": 4, "tags": ["极限", "无穷小"], "latex": "\\lim f(x)=A\\iff f(x)=A+\\alpha(x),\\quad\\lim\\alpha(x)=0", "summary": "函数极限等于 A 的充要条件是 f(x) 可写成常数 A 与一个无穷小量之和。"}, {"id": "limit-015", "subject": "higher-mathematics", "subjectName": "高等数学", "subjectColor": "#0f6e56", "chapter": "函数、极限、连续", "name": "无穷小量的比较与阶", "category": "定义", "importance": 4, "tags": ["无穷小", "阶", "比较"], "latex": "\\lim\\frac{\\beta}{\\alpha}=0\\Rightarrow\\beta=o(\\alpha);\\quad\\lim\\frac{\\beta}{\\alpha}=c\\neq0\\Rightarrow\\beta=O(\\alpha);\\quad\\lim\\frac{\\beta}{\\alpha}=1\\Rightarrow\\beta\\sim\\alpha", "summary": "通过比值极限把无穷小分为高阶、同阶、等价等等级。原书列出高阶、低阶、同阶、等价与 k 阶无穷小的定义。"}, {"id": "limit-016", "subject": "higher-mathematics", "subjectName": "高等数学", "subjectColor": "#0f6e56", "chapter": "函数、极限、连续", "name": "常用等价无穷小", "category": "公式", "importance": 5, "tags": ["无穷小", "等价替换", "常用"], "latex": "x\\to0:\\ \\sin x\\sim\\tan x\\sim\\arcsin x\\sim\\arctan x\\sim x,\\quad 1-\\cos x\\sim\\frac{x^2}{2},\\quad e^x-1\\sim\\ln(1+x)\\sim x,\\quad (1+x)^a-1\\sim ax", "summary": "原书等价无穷小替换定理配套的一组常用等价关系，是求 0/0 型极限最常用的工具。"}, {"id": "limit-017", "subject": "higher-mathematics", "subjectName": "高等数学", "subjectColor": "#0f6e56", "chapter": "函数、极限、连续", "name": "无穷大量与无穷小量的关系", "category": "定理", "importance": 3, "tags": ["无穷大", "无穷小"], "latex": "\\lim f(x)=\\infty\\Rightarrow\\lim\\frac{1}{f(x)}=0;\\qquad\\lim f(x)=0,\\ f(x)\\neq0\\Rightarrow\\lim\\frac{1}{f(x)}=\\infty", "summary": "在同一变化过程中，无穷大量的倒数是无穷小量，非零无穷小量的倒数是无穷大量。"}, {"id": "limit-018", "subject": "higher-mathematics", "subjectName": "高等数学", "subjectColor": "#0f6e56", "chapter": "函数、极限、连续", "name": "函数连续的定义", "category": "定义", "importance": 4, "tags": ["连续", "定义", "增量"], "latex": "\\lim_{\\Delta x\\to0}\\Delta y=\\lim_{\\Delta x\\to0}\\big[f(x_0+\\Delta x)-f(x_0)\\big]=0\\iff\\lim_{x\\to x_0}f(x)=f(x_0)", "summary": "函数在 x₀ 连续等价于增量趋于零，也等价于极限值等于函数值。"}, {"id": "limit-019", "subject": "higher-mathematics", "subjectName": "高等数学", "subjectColor": "#0f6e56", "chapter": "函数、极限、连续", "name": "间断点的分类", "category": "定义", "importance": 3, "tags": ["连续", "间断点", "分类"], "latex": "f(x_0-0)=f(x_0+0)\\neq f(x_0)\\Rightarrow\\text{removable};\\qquad f(x_0-0)\\neq f(x_0+0)\\Rightarrow\\text{jump}", "summary": "原书按左右极限是否存在把间断点分为第一类（可去、跳跃）与第二类（无穷、振荡等）。"}, {"id": "limit-020", "subject": "higher-mathematics", "subjectName": "高等数学", "subjectColor": "#0f6e56", "chapter": "函数、极限、连续", "name": "闭区间上连续函数的性质", "category": "定理", "importance": 4, "tags": ["连续", "闭区间", "最值"], "latex": "f\\in C[a,b]\\Rightarrow\\exists\\ \\xi,\\eta\\in[a,b]:\\ f(\\xi)=\\min_{[a,b]}f,\\quad f(\\eta)=\\max_{[a,b]}f", "summary": "闭区间上连续函数必有界、必取得最大值与最小值（最值定理与有界性定理）。"}, {"id": "limit-021", "subject": "higher-mathematics", "subjectName": "高等数学", "subjectColor": "#0f6e56", "chapter": "函数、极限、连续", "name": "介值定理", "category": "定理", "importance": 4, "tags": ["连续", "介值", "零点"], "latex": "f\\in C[a,b],\\ \\mu\\in\\Big(\\min\\{f(a),f(b)\\},\\max\\{f(a),f(b)\\}\\Big)\\Rightarrow\\exists\\xi\\in(a,b):f(\\xi)=\\mu", "summary": "闭区间上连续函数必取得介于两端值之间的一切值；取 μ=0 即为零点定理。"}, {"id": "derivative-001", "subject": "higher-mathematics", "subjectName": "高等数学", "subjectColor": "#0f6e56", "chapter": "一元函数微分学", "name": "导数的定义式", "category": "计算", "importance": 5, "tags": ["导数", "微分", "定义"], "latex": "f'(x_0)=\\lim_{\\Delta x\\to 0}\\frac{\\Delta y}{\\Delta x}=\\lim_{\\Delta x\\to 0}\\frac{f(x_0+\\Delta x)-f(x_0)}{\\Delta x}", "summary": "导数刻画函数在一点处的瞬时变化率，是函数增量与自变量增量之比的极限。"}, {"id": "derivative-002", "subject": "higher-mathematics", "subjectName": "高等数学", "subjectColor": "#0f6e56", "chapter": "一元函数微分学", "name": "基本初等函数的导数公式", "category": "计算", "importance": 5, "tags": ["导数", "基本初等函数", "导数公式"], "latex": "\\begin{aligned}&(C)'=0,\\quad (x^a)'=ax^{a-1},\\quad (a^x)'=a^x\\ln a,\\quad (e^x)'=e^x\\\\&(\\ln x)'=\\frac{1}{x},\\quad (\\sin x)'=\\cos x,\\quad (\\cos x)'=-\\sin x\\\\&(\\tan x)'=\\sec^2 x,\\quad (\\cot x)'=-\\csc^2 x\\\\&(\\arcsin x)'=\\frac{1}{\\sqrt{1-x^2}},\\quad (\\arctan x)'=\\frac{1}{1+x^2}\\end{aligned}", "summary": "六类基本初等函数的导数公式，是求导运算的基础。"}, {"id": "derivative-003", "subject": "higher-mathematics", "subjectName": "高等数学", "subjectColor": "#0f6e56", "chapter": "一元函数微分学", "name": "莱布尼茨公式", "category": "计算", "importance": 3, "tags": ["高阶导数", "莱布尼茨", "乘积求导"], "latex": "(uv)^{(n)}=\\sum_{k=0}^{n}C_n^{k}\\,u^{(n-k)}v^{(k)}", "summary": "两个函数乘积的 n 阶导数公式，是二项式定理在求导中的类比。"}, {"id": "derivative-004", "subject": "higher-mathematics", "subjectName": "高等数学", "subjectColor": "#0f6e56", "chapter": "一元函数微分学", "name": "拉格朗日中值定理", "category": "定理", "importance": 5, "tags": ["中值定理", "拉格朗日", "微分"], "latex": "f(b)-f(a)=f'(\\xi)(b-a),\\quad \\xi\\in(a,b)", "summary": "闭区间连续、开区间可导的函数，端点函数值之差等于某中间点导数与区间长度之积。"}, {"id": "derivative-005", "subject": "higher-mathematics", "subjectName": "高等数学", "subjectColor": "#0f6e56", "chapter": "一元函数微分学", "name": "洛必达法则", "category": "计算", "importance": 5, "tags": ["洛必达", "未定式", "极限"], "latex": "\\lim\\frac{f(x)}{g(x)}=\\lim\\frac{f'(x)}{g'(x)}", "summary": "0/0 型与 ∞/∞ 型未定式，可通过分子分母分别求导来求极限。"}, {"id": "derivative-006", "subject": "higher-mathematics", "subjectName": "高等数学", "subjectColor": "#0f6e56", "chapter": "一元函数微分学", "name": "泰勒公式", "category": "定理", "importance": 5, "tags": ["泰勒公式", "麦克劳林", "展开"], "latex": "f(x)=f(x_0)+f'(x_0)(x-x_0)+\\frac{f''(x_0)}{2!}(x-x_0)^2+\\cdots+\\frac{f^{(n)}(x_0)}{n!}(x-x_0)^n+o((x-x_0)^n)", "summary": "用多项式逼近光滑函数，是求极限、近似计算的通用工具。"}, {"id": "derivative-007", "subject": "higher-mathematics", "subjectName": "高等数学", "subjectColor": "#0f6e56", "chapter": "一元函数微分学", "name": "微分的定义式", "category": "定义", "importance": 4, "tags": ["微分", "导数", "定义"], "latex": "\\mathrm{d}y=f'(x)\\,\\mathrm{d}x,\\qquad \\Delta y=f'(x)\\Delta x+o(\\Delta x)", "summary": "函数增量可分解为线性主部（微分）与高阶无穷小两部分，可微的充要条件是可导。"}, {"id": "derivative-008", "subject": "higher-mathematics", "subjectName": "高等数学", "subjectColor": "#0f6e56", "chapter": "一元函数微分学", "name": "导数的四则运算法则", "category": "法则", "importance": 5, "tags": ["导数", "四则运算"], "latex": "(u\\pm v)'=u'\\pm v',\\quad(uv)'=u'v+uv',\\quad\\left(\\frac{u}{v}\\right)'=\\frac{u'v-uv'}{v^2}", "summary": "和差积商的求导法则，是求导计算的基础。"}, {"id": "derivative-009", "subject": "higher-mathematics", "subjectName": "高等数学", "subjectColor": "#0f6e56", "chapter": "一元函数微分学", "name": "复合函数的求导法则", "category": "法则", "importance": 5, "tags": ["导数", "链式法则", "复合函数"], "latex": "y=f(u),\\ u=g(x)\\Rightarrow\\frac{\\mathrm{d}y}{\\mathrm{d}x}=\\frac{\\mathrm{d}y}{\\mathrm{d}u}\\cdot\\frac{\\mathrm{d}u}{\\mathrm{d}x}=f'(u)\\,g'(x)", "summary": "链式法则：由外到内逐层求导并相乘。"}, {"id": "derivative-010", "subject": "higher-mathematics", "subjectName": "高等数学", "subjectColor": "#0f6e56", "chapter": "一元函数微分学", "name": "反函数的导数", "category": "法则", "importance": 3, "tags": ["导数", "反函数"], "latex": "\\frac{\\mathrm{d}y}{\\mathrm{d}x}=\\frac{1}{\\dfrac{\\mathrm{d}x}{\\mathrm{d}y}},\\qquad \\varphi'(y)\\neq0", "summary": "反函数的导数等于原函数导数的倒数。"}, {"id": "derivative-011", "subject": "higher-mathematics", "subjectName": "高等数学", "subjectColor": "#0f6e56", "chapter": "一元函数微分学", "name": "隐函数的求导法", "category": "计算", "importance": 4, "tags": ["导数", "隐函数"], "latex": "F(x,y)=0\\Rightarrow\\frac{\\mathrm{d}y}{\\mathrm{d}x}=-\\frac{F_x}{F_y}\\quad(F_y\\neq0)", "summary": "对方程 F(x,y)=0 两边关于 x 求导并解出 y′；也可用偏导数形式直接给出。"}, {"id": "derivative-012", "subject": "higher-mathematics", "subjectName": "高等数学", "subjectColor": "#0f6e56", "chapter": "一元函数微分学", "name": "参数方程确定的函数的导数", "category": "计算", "importance": 4, "tags": ["导数", "参数方程", "二阶导"], "latex": "x=\\varphi(t),\\ y=\\psi(t)\\Rightarrow\\frac{\\mathrm{d}y}{\\mathrm{d}x}=\\frac{\\psi'(t)}{\\varphi'(t)},\\quad\\frac{\\mathrm{d}^2y}{\\mathrm{d}x^2}=\\frac{\\psi''\\varphi'-\\psi'\\varphi''}{(\\varphi')^3}", "summary": "参数方程的一阶与二阶导数公式。"}, {"id": "derivative-013", "subject": "higher-mathematics", "subjectName": "高等数学", "subjectColor": "#0f6e56", "chapter": "一元函数微分学", "name": "罗尔定理", "category": "定理", "importance": 4, "tags": ["中值定理", "罗尔"], "latex": "f\\in C[a,b],\\ f\\in D(a,b),\\ f(a)=f(b)\\Rightarrow\\exists\\xi\\in(a,b):f'(\\xi)=0", "summary": "闭区间连续、开区间可导且端点值相等，则区间内至少存在一点导数为零。"}, {"id": "derivative-014", "subject": "higher-mathematics", "subjectName": "高等数学", "subjectColor": "#0f6e56", "chapter": "一元函数微分学", "name": "柯西中值定理", "category": "定理", "importance": 3, "tags": ["中值定理", "柯西"], "latex": "\\frac{f(b)-f(a)}{g(b)-g(a)}=\\frac{f'(\\xi)}{g'(\\xi)},\\qquad \\xi\\in(a,b)", "summary": "两个函数在区间上的增量之比等于某点导数之比，是洛必达法则的理论基础。"}, {"id": "derivative-015", "subject": "higher-mathematics", "subjectName": "高等数学", "subjectColor": "#0f6e56", "chapter": "一元函数微分学", "name": "常用函数的麦克劳林展开式", "category": "展开式", "importance": 5, "tags": ["泰勒", "麦克劳林", "展开"], "latex": "e^x=\\sum_{k=0}^{n}\\frac{x^k}{k!}+o(x^n),\\quad\\sin x=\\sum_{k=0}^{n}\\frac{(-1)^kx^{2k+1}}{(2k+1)!}+o(x^{2n+2}),\\quad\\frac{1}{1-x}=\\sum_{k=0}^{n}x^k+o(x^n)", "summary": "原书在带皮亚诺余项的泰勒定理后列出几个常用函数的麦克劳林展开式，用于求极限与近似计算。"}, {"id": "derivative-016", "subject": "higher-mathematics", "subjectName": "高等数学", "subjectColor": "#0f6e56", "chapter": "一元函数微分学", "name": "函数单调性的判定定理", "category": "判别法", "importance": 4, "tags": ["导数", "单调性", "判别"], "latex": "f'(x)>0\\ \\Rightarrow\\ f\\ \\nearrow;\\qquad f'(x)<0\\ \\Rightarrow\\ f\\ \\searrow", "summary": "在区间内用一阶导数的符号判定函数的单调增加与单调减少。"}, {"id": "derivative-017", "subject": "higher-mathematics", "subjectName": "高等数学", "subjectColor": "#0f6e56", "chapter": "一元函数微分学", "name": "极值的充分条件", "category": "判别法", "importance": 4, "tags": ["导数", "极值", "二阶导"], "latex": "f'(x_0)=0,\\ f''(x_0)<0\\Rightarrow\\max;\\qquad f'(x_0)=0,\\ f''(x_0)>0\\Rightarrow\\min", "summary": "可导点处极值的必要条件是 f′(x₀)=0；再用二阶导数符号判定极大还是极小。"}, {"id": "derivative-018", "subject": "higher-mathematics", "subjectName": "高等数学", "subjectColor": "#0f6e56", "chapter": "一元函数微分学", "name": "凹凸性的判定定理", "category": "判别法", "importance": 3, "tags": ["导数", "凹凸性", "二阶导"], "latex": "f''(x)>0\\Rightarrow\\mathrm{concave\\ up};\\qquad f''(x)<0\\Rightarrow\\mathrm{concave\\ down}", "summary": "用二阶导数符号判定曲线的凹向（原书称凹凸性），是作图与不等式证明的常用工具。"}, {"id": "derivative-019", "subject": "higher-mathematics", "subjectName": "高等数学", "subjectColor": "#0f6e56", "chapter": "一元函数微分学", "name": "拐点的判定", "category": "判别法", "importance": 3, "tags": ["导数", "拐点"], "latex": "f''(x_0)=0\\ \\text{or}\\ f''(x_0)\\ \\text{DNE},\\qquad f''(x_0^-)\\cdot f''(x_0^+)<0\\Rightarrow(x_0,f(x_0))\\ \\mathrm{is\\ inflection\\ point}", "summary": "二阶导数为零或不存在的点，若两侧二阶导数变号，则该点为曲线的拐点。"}, {"id": "derivative-020", "subject": "higher-mathematics", "subjectName": "高等数学", "subjectColor": "#0f6e56", "chapter": "一元函数微分学", "name": "渐近线的求法", "category": "计算", "importance": 4, "tags": ["渐近线", "极限", "作图"], "latex": "\\lim_{x\\to x_0}f(x)=\\infty\\Rightarrow x=x_0;\\qquad a=\\lim_{x\\to\\infty}\\frac{f(x)}{x},\\ b=\\lim_{x\\to\\infty}[f(x)-ax]\\Rightarrow y=ax+b", "summary": "通过极限求垂直渐近线、水平渐近线与斜渐近线。"}, {"id": "derivative-021", "subject": "higher-mathematics", "subjectName": "高等数学", "subjectColor": "#0f6e56", "chapter": "一元函数微分学", "name": "弧微分与曲率", "category": "公式", "importance": 3, "tags": ["曲率", "弧微分", "曲率半径"], "latex": "\\mathrm{d}s=\\sqrt{1+y'^2}\\,\\mathrm{d}x,\\qquad K=\\frac{|y''|}{\\left(1+y'^2\\right)^{3/2}},\\qquad\\rho=\\frac{1}{K}", "summary": "原书在微分学应用部分给出弧微分、曲率与曲率半径的计算公式。"}, {"id": "integral-001", "subject": "higher-mathematics", "subjectName": "高等数学", "subjectColor": "#0f6e56", "chapter": "一元函数积分学", "name": "基本积分公式", "category": "计算", "importance": 5, "tags": ["不定积分", "基本积分", "原函数"], "latex": "\\begin{aligned}&\\int x^a\\,dx=\\frac{x^{a+1}}{a+1}+C\\ (a\\neq -1),\\quad \\int\\frac{1}{x}\\,dx=\\ln|x|+C\\\\&\\int e^x\\,dx=e^x+C,\\quad \\int\\sin x\\,dx=-\\cos x+C,\\quad \\int\\cos x\\,dx=\\sin x+C\\\\&\\int\\frac{1}{1+x^2}\\,dx=\\arctan x+C,\\quad \\int\\frac{1}{\\sqrt{1-x^2}}\\,dx=\\arcsin x+C\\end{aligned}", "summary": "由基本导数公式逆推得到的常用不定积分公式。"}, {"id": "integral-002", "subject": "higher-mathematics", "subjectName": "高等数学", "subjectColor": "#0f6e56", "chapter": "一元函数积分学", "name": "牛顿-莱布尼茨公式", "category": "计算", "importance": 5, "tags": ["定积分", "牛顿莱布尼茨", "微积分基本定理"], "latex": "\\int_a^b f(x)\\,dx=F(b)-F(a),\\quad F'(x)=f(x)", "summary": "微积分基本定理：定积分等于原函数在上下限处的值之差。"}, {"id": "integral-003", "subject": "higher-mathematics", "subjectName": "高等数学", "subjectColor": "#0f6e56", "chapter": "一元函数积分学", "name": "分部积分法", "category": "计算", "importance": 5, "tags": ["不定积分", "定积分", "分部积分"], "latex": "\\int u\\,dv=uv-\\int v\\,du", "summary": "积分形式下的乘积求导逆运算，用于两类不同类型函数相乘的积分。"}, {"id": "integral-004", "subject": "higher-mathematics", "subjectName": "高等数学", "subjectColor": "#0f6e56", "chapter": "一元函数积分学", "name": "第一换元积分法（凑微分法）", "category": "计算", "importance": 4, "tags": ["不定积分", "换元积分", "凑微分"], "latex": "\\int f[\\varphi(x)]\\,\\varphi'(x)\\,dx=\\int f(u)\\,du,\\quad u=\\varphi(x)", "summary": "把被积函数凑成复合函数与内层导数之积的形式后积分。"}, {"id": "integral-005", "subject": "higher-mathematics", "subjectName": "高等数学", "subjectColor": "#0f6e56", "chapter": "一元函数积分学", "name": "不定积分的定义与性质", "category": "定义", "importance": 4, "tags": ["不定积分", "原函数", "性质"], "latex": "\\int f(x)\\,\\mathrm{d}x=F(x)+C\\iff F'(x)=f(x);\\qquad\\int\\big[k_1f(x)+k_2g(x)\\big]\\mathrm{d}x=k_1\\int f\\,\\mathrm{d}x+k_2\\int g\\,\\mathrm{d}x", "summary": "原函数的全体称为不定积分；积分运算对函数的线性组合保持线性。"}, {"id": "integral-006", "subject": "higher-mathematics", "subjectName": "高等数学", "subjectColor": "#0f6e56", "chapter": "一元函数积分学", "name": "第二换元积分法", "category": "计算", "importance": 4, "tags": ["不定积分", "换元", "第二换元"], "latex": "x=\\varphi(t):\\quad\\int f(x)\\,\\mathrm{d}x=\\int f\\big(\\varphi(t)\\big)\\varphi'(t)\\,\\mathrm{d}t", "summary": "通过作变量代换 x=φ(t) 化去根式或三角结构，求出结果后再回代。"}, {"id": "integral-007", "subject": "higher-mathematics", "subjectName": "高等数学", "subjectColor": "#0f6e56", "chapter": "一元函数积分学", "name": "定积分的定义式", "category": "定义", "importance": 4, "tags": ["定积分", "黎曼和", "定义"], "latex": "\\int_a^b f(x)\\,\\mathrm{d}x=\\lim_{\\lambda\\to0}\\sum_{i=1}^{n}f(\\xi_i)\\Delta x_i,\\qquad \\lambda=\\max_{1\\le i\\le n}\\Delta x_i", "summary": "定积分是分割、近似、求和、取极限得到的黎曼和的极限。"}, {"id": "integral-008", "subject": "higher-mathematics", "subjectName": "高等数学", "subjectColor": "#0f6e56", "chapter": "一元函数积分学", "name": "定积分的性质", "category": "性质", "importance": 4, "tags": ["定积分", "性质", "可加性"], "latex": "\\int_a^b f\\,\\mathrm{d}x=-\\int_b^a f\\,\\mathrm{d}x,\\quad\\int_a^b(f\\pm g)\\mathrm{d}x=\\int_a^b f\\,\\mathrm{d}x\\pm\\int_a^b g\\,\\mathrm{d}x,\\quad\\int_a^b f\\,\\mathrm{d}x=\\int_a^c f\\,\\mathrm{d}x+\\int_c^b f\\,\\mathrm{d}x", "summary": "定积分的线性性、反号性与对积分区间的可加性，以及比较定理与估值定理。"}, {"id": "integral-009", "subject": "higher-mathematics", "subjectName": "高等数学", "subjectColor": "#0f6e56", "chapter": "一元函数积分学", "name": "变上限函数的求导定理", "category": "定理", "importance": 5, "tags": ["定积分", "变上限", "求导"], "latex": "\\Phi(x)=\\int_a^x f(t)\\,\\mathrm{d}t\\Rightarrow\\Phi'(x)=f(x);\\qquad\\frac{\\mathrm{d}}{\\mathrm{d}x}\\int_{\\alpha(x)}^{\\beta(x)}f(t)\\,\\mathrm{d}t=f(\\beta)\\beta'-f(\\alpha)\\alpha'", "summary": "变上限积分对上限求导等于被积函数在上限处的值，是联系微分与积分的核心结论。"}, {"id": "integral-010", "subject": "higher-mathematics", "subjectName": "高等数学", "subjectColor": "#0f6e56", "chapter": "一元函数积分学", "name": "定积分的换元积分法", "category": "计算", "importance": 4, "tags": ["定积分", "换元"], "latex": "\\int_a^b f(x)\\,\\mathrm{d}x=\\int_{\\alpha}^{\\beta}f\\big(\\varphi(t)\\big)\\varphi'(t)\\,\\mathrm{d}t,\\quad \\varphi(\\alpha)=a,\\ \\varphi(\\beta)=b", "summary": "定积分换元时必须同步更换积分上下限，换元后不必回代。"}, {"id": "integral-011", "subject": "higher-mathematics", "subjectName": "高等数学", "subjectColor": "#0f6e56", "chapter": "一元函数积分学", "name": "定积分的分部积分法", "category": "计算", "importance": 4, "tags": ["定积分", "分部积分"], "latex": "\\int_a^b u\\,\\mathrm{d}v=\\big[uv\\big]_a^b-\\int_a^b v\\,\\mathrm{d}u", "summary": "把难以直接积分的乘积转化为较易积分的形式，先算出边界项 uv 再减去剩余积分。"}, {"id": "integral-012", "subject": "higher-mathematics", "subjectName": "高等数学", "subjectColor": "#0f6e56", "chapter": "一元函数积分学", "name": "华里士公式", "category": "公式", "importance": 4, "tags": ["定积分", "华里士", "三角积分"], "latex": "I_n=\\int_0^{\\pi/2}\\sin^n x\\,\\mathrm{d}x=\\int_0^{\\pi/2}\\cos^n x\\,\\mathrm{d}x=\\begin{cases}\\frac{(n-1)!!}{n!!}\\cdot\\frac{\\pi}{2},&n\\ \\mathrm{even}\\\\\\frac{(n-1)!!}{n!!},&n\\ \\mathrm{odd}\\end{cases}", "summary": "原书在定积分重要结论部分给出的华里士（点火）公式，用于快速计算正弦、余弦幂在 [0,π/2] 上的积分。"}, {"id": "integral-013", "subject": "higher-mathematics", "subjectName": "高等数学", "subjectColor": "#0f6e56", "chapter": "一元函数积分学", "name": "平面图形的面积", "category": "应用", "importance": 4, "tags": ["定积分", "面积", "极坐标"], "latex": "S=\\int_a^b\\big|f(x)-g(x)\\big|\\,\\mathrm{d}x,\\qquad S=\\frac{1}{2}\\int_{\\alpha}^{\\beta}r^2(\\theta)\\,\\mathrm{d}\\theta", "summary": "直角坐标下用上下曲线之差的积分求面积；极坐标下用扇形微元求面积。"}, {"id": "integral-014", "subject": "higher-mathematics", "subjectName": "高等数学", "subjectColor": "#0f6e56", "chapter": "一元函数积分学", "name": "旋转体的体积", "category": "应用", "importance": 4, "tags": ["定积分", "旋转体", "体积"], "latex": "V_x=\\pi\\int_a^b f^2(x)\\,\\mathrm{d}x,\\qquad V_y=2\\pi\\int_a^b x f(x)\\,\\mathrm{d}x", "summary": "平面图形绕 x 轴旋转用圆盘法，绕 y 轴旋转可用柱壳法。"}, {"id": "integral-015", "subject": "higher-mathematics", "subjectName": "高等数学", "subjectColor": "#0f6e56", "chapter": "一元函数积分学", "name": "旋转曲面的表面积", "category": "应用", "importance": 3, "tags": ["定积分", "旋转曲面", "表面积"], "latex": "S=2\\pi\\int_a^b f(x)\\sqrt{1+f'^2(x)}\\,\\mathrm{d}x", "summary": "曲线 y=f(x) 绕 x 轴旋转所得旋转曲面的侧面积。"}, {"id": "integral-016", "subject": "higher-mathematics", "subjectName": "高等数学", "subjectColor": "#0f6e56", "chapter": "一元函数积分学", "name": "平面曲线段的弧长", "category": "应用", "importance": 3, "tags": ["定积分", "弧长", "极坐标"], "latex": "s=\\int_a^b\\sqrt{1+y'^2}\\,\\mathrm{d}x=\\int_{\\alpha}^{\\beta}\\sqrt{r^2+r'^2}\\,\\mathrm{d}\\theta", "summary": "直角坐标与极坐标下平面曲线弧长的计算公式。"}, {"id": "integral-017", "subject": "higher-mathematics", "subjectName": "高等数学", "subjectColor": "#0f6e56", "chapter": "一元函数积分学", "name": "无穷区间上的反常积分", "category": "定义", "importance": 4, "tags": ["反常积分", "无穷区间", "收敛"], "latex": "\\int_a^{+\\infty}f(x)\\,\\mathrm{d}x=\\lim_{t\\to+\\infty}\\int_a^t f(x)\\,\\mathrm{d}x", "summary": "无穷区间上的反常积分定义为变上限积分的极限；极限存在称收敛，否则发散。原书给出 ∫₁⁺∞ dx/xᵖ 当 p>1 时收敛的结论。"}, {"id": "integral-018", "subject": "higher-mathematics", "subjectName": "高等数学", "subjectColor": "#0f6e56", "chapter": "一元函数积分学", "name": "无界函数的反常积分（瑕积分）", "category": "定义", "importance": 3, "tags": ["反常积分", "瑕积分", "收敛"], "latex": "\\int_a^b f(x)\\,\\mathrm{d}x=\\lim_{\\varepsilon\\to0^+}\\int_{a+\\varepsilon}^{b}f(x)\\,\\mathrm{d}x", "summary": "被积函数在区间端点附近无界时，用去心区间积分的极限定义瑕积分；原书同样给出 p 判别结论。"}, {"id": "vector-001", "subject": "higher-mathematics", "subjectName": "高等数学", "subjectColor": "#0f6e56", "chapter": "向量代数与空间解析几何", "name": "向量的数量积", "category": "公式", "importance": 4, "tags": ["向量", "数量积", "点积"], "latex": "\\boldsymbol{a}\\cdot\\boldsymbol{b}=|\\boldsymbol{a}||\\boldsymbol{b}|\\cos\\theta=a_xb_x+a_yb_y+a_zb_z", "summary": "两向量的数量积（点积）既可用模与夹角表示，也可用坐标分量乘积之和表示。"}, {"id": "vector-002", "subject": "higher-mathematics", "subjectName": "高等数学", "subjectColor": "#0f6e56", "chapter": "向量代数与空间解析几何", "name": "向量的向量积", "category": "公式", "importance": 4, "tags": ["向量", "向量积", "叉积"], "latex": "\\boldsymbol{a}\\times\\boldsymbol{b}=\\begin{vmatrix}\\boldsymbol{i}&\\boldsymbol{j}&\\boldsymbol{k}\\\\a_x&a_y&a_z\\\\b_x&b_y&b_z\\end{vmatrix},\\qquad |\\boldsymbol{a}\\times\\boldsymbol{b}|=|\\boldsymbol{a}||\\boldsymbol{b}|\\sin\\theta", "summary": "向量积是同时垂直于 a、b 的向量，其模等于以 a、b 为邻边的平行四边形面积。"}, {"id": "vector-003", "subject": "higher-mathematics", "subjectName": "高等数学", "subjectColor": "#0f6e56", "chapter": "向量代数与空间解析几何", "name": "向量的混合积", "category": "公式", "importance": 3, "tags": ["向量", "混合积", "体积"], "latex": "[\\boldsymbol{a}\\ \\boldsymbol{b}\\ \\boldsymbol{c}]=(\\boldsymbol{a}\\times\\boldsymbol{b})\\cdot\\boldsymbol{c}=\\begin{vmatrix}a_x&a_y&a_z\\\\b_x&b_y&b_z\\\\c_x&c_y&c_z\\end{vmatrix}", "summary": "三个向量的混合积，其绝对值等于以三向量为棱的平行六面体体积。"}, {"id": "vector-004", "subject": "higher-mathematics", "subjectName": "高等数学", "subjectColor": "#0f6e56", "chapter": "向量代数与空间解析几何", "name": "两向量夹角与平行垂直条件", "category": "公式", "importance": 4, "tags": ["向量", "夹角", "垂直", "平行"], "latex": "\\cos\\theta=\\frac{\\boldsymbol{a}\\cdot\\boldsymbol{b}}{|\\boldsymbol{a}||\\boldsymbol{b}|};\\qquad \\boldsymbol{a}\\perp\\boldsymbol{b}\\iff\\boldsymbol{a}\\cdot\\boldsymbol{b}=0;\\qquad \\boldsymbol{a}\\parallel\\boldsymbol{b}\\iff\\boldsymbol{a}\\times\\boldsymbol{b}=\\boldsymbol{0}", "summary": "由数量积求夹角余弦；点积为零对应垂直，叉积为零对应平行。"}, {"id": "vector-005", "subject": "higher-mathematics", "subjectName": "高等数学", "subjectColor": "#0f6e56", "chapter": "向量代数与空间解析几何", "name": "方向余弦", "category": "公式", "importance": 3, "tags": ["向量", "方向余弦"], "latex": "\\cos\\alpha=\\frac{a_x}{|\\boldsymbol{a}|},\\ \\cos\\beta=\\frac{a_y}{|\\boldsymbol{a}|},\\ \\cos\\gamma=\\frac{a_z}{|\\boldsymbol{a}|},\\qquad\\cos^2\\alpha+\\cos^2\\beta+\\cos^2\\gamma=1", "summary": "向量与三个坐标轴夹角的余弦称为方向余弦，三者平方和恒为 1。"}, {"id": "vector-006", "subject": "higher-mathematics", "subjectName": "高等数学", "subjectColor": "#0f6e56", "chapter": "向量代数与空间解析几何", "name": "平面的方程", "category": "公式", "importance": 4, "tags": ["空间解析几何", "平面", "方程"], "latex": "A(x-x_0)+B(y-y_0)+C(z-z_0)=0;\\qquad Ax+By+Cz+D=0;\\qquad\\frac{x}{a}+\\frac{y}{b}+\\frac{z}{c}=1", "summary": "平面的点法式、一般式与截距式方程，法向量为 (A,B,C)。"}, {"id": "vector-007", "subject": "higher-mathematics", "subjectName": "高等数学", "subjectColor": "#0f6e56", "chapter": "向量代数与空间解析几何", "name": "点到平面的距离", "category": "公式", "importance": 4, "tags": ["空间解析几何", "距离", "平面"], "latex": "d=\\frac{|Ax_0+By_0+Cz_0+D|}{\\sqrt{A^2+B^2+C^2}}", "summary": "点 (x₀,y₀,z₀) 到平面 Ax+By+Cz+D=0 的距离。"}, {"id": "vector-008", "subject": "higher-mathematics", "subjectName": "高等数学", "subjectColor": "#0f6e56", "chapter": "向量代数与空间解析几何", "name": "空间直线的方程", "category": "公式", "importance": 4, "tags": ["空间解析几何", "直线", "方程"], "latex": "\\frac{x-x_0}{m}=\\frac{y-y_0}{n}=\\frac{z-z_0}{p};\\qquad \\begin{cases}x=x_0+mt\\\\y=y_0+nt\\\\z=z_0+pt\\end{cases}", "summary": "空间直线的对称式（标准式）与参数式方程，(m,n,p) 为方向向量。"}, {"id": "vector-009", "subject": "higher-mathematics", "subjectName": "高等数学", "subjectColor": "#0f6e56", "chapter": "向量代数与空间解析几何", "name": "点到直线的距离", "category": "公式", "importance": 3, "tags": ["空间解析几何", "距离", "直线"], "latex": "d=\\frac{\\big|\\overrightarrow{M_0M_1}\\times\\boldsymbol{s}\\big|}{|\\boldsymbol{s}|}", "summary": "由直线上一点 M₀ 到点 M₁ 的向量与方向向量 s 的叉积模除以 |s| 得到点到直线的距离。"}, {"id": "vector-010", "subject": "higher-mathematics", "subjectName": "高等数学", "subjectColor": "#0f6e56", "chapter": "向量代数与空间解析几何", "name": "常见二次曲面", "category": "公式", "importance": 3, "tags": ["空间解析几何", "二次曲面"], "latex": "\\frac{x^2}{a^2}+\\frac{y^2}{b^2}+\\frac{z^2}{c^2}=1;\\quad\\frac{x^2}{a^2}+\\frac{y^2}{b^2}-\\frac{z^2}{c^2}=1;\\quad z=\\frac{x^2}{a^2}+\\frac{y^2}{b^2}", "summary": "原书列举的椭球面、单叶双曲面与椭圆抛物面等常见二次曲面的标准方程。"}, {"id": "multi-001", "subject": "higher-mathematics", "subjectName": "高等数学", "subjectColor": "#0f6e56", "chapter": "多元函数微分学", "name": "偏导数的定义", "category": "定义", "importance": 4, "tags": ["偏导数", "多元函数", "定义"], "latex": "f_x(x_0,y_0)=\\lim_{\\Delta x\\to0}\\frac{f(x_0+\\Delta x,y_0)-f(x_0,y_0)}{\\Delta x},\\quad f_y(x_0,y_0)=\\lim_{\\Delta y\\to0}\\frac{f(x_0,y_0+\\Delta y)-f(x_0,y_0)}{\\Delta y}", "summary": "固定其余自变量，只对某一个自变量求导数即得偏导数。"}, {"id": "multi-002", "subject": "higher-mathematics", "subjectName": "高等数学", "subjectColor": "#0f6e56", "chapter": "多元函数微分学", "name": "全微分的定义", "category": "定义", "importance": 4, "tags": ["全微分", "多元函数", "定义"], "latex": "\\mathrm{d}z=\\frac{\\partial z}{\\partial x}\\mathrm{d}x+\\frac{\\partial z}{\\partial y}\\mathrm{d}y,\\qquad \\Delta z=\\mathrm{d}z+o(\\rho),\\ \\rho=\\sqrt{(\\Delta x)^2+(\\Delta y)^2}", "summary": "全微分是函数增量的线性主部；偏导数连续是可微的充分条件。"}, {"id": "multi-003", "subject": "higher-mathematics", "subjectName": "高等数学", "subjectColor": "#0f6e56", "chapter": "多元函数微分学", "name": "复合函数微分法", "category": "法则", "importance": 5, "tags": ["偏导数", "链式法则", "复合函数"], "latex": "z=f(u,v),\\ u=u(x,y),\\ v=v(x,y)\\Rightarrow\\frac{\\partial z}{\\partial x}=\\frac{\\partial f}{\\partial u}\\frac{\\partial u}{\\partial x}+\\frac{\\partial f}{\\partial v}\\frac{\\partial v}{\\partial x}", "summary": "多元复合函数求偏导的链式法则：沿所有中间变量路径求和。"}, {"id": "multi-004", "subject": "higher-mathematics", "subjectName": "高等数学", "subjectColor": "#0f6e56", "chapter": "多元函数微分学", "name": "隐函数求导法", "category": "计算", "importance": 4, "tags": ["偏导数", "隐函数"], "latex": "F(x,y,z)=0\\Rightarrow\\frac{\\partial z}{\\partial x}=-\\frac{F_x}{F_z},\\qquad\\frac{\\partial z}{\\partial y}=-\\frac{F_y}{F_z}\\quad(F_z\\neq0)", "summary": "由方程 F=0 确定的隐函数，其偏导数可用 F 的三个偏商表示。"}, {"id": "multi-005", "subject": "higher-mathematics", "subjectName": "高等数学", "subjectColor": "#0f6e56", "chapter": "多元函数微分学", "name": "方向导数与梯度", "category": "公式", "importance": 4, "tags": ["方向导数", "梯度", "多元函数"], "latex": "\\frac{\\partial f}{\\partial \\boldsymbol{l}}=f_x\\cos\\alpha+f_y\\cos\\beta+f_z\\cos\\gamma=\\nabla f\\cdot\\boldsymbol{e}_l,\\qquad \\nabla f=(f_x,f_y,f_z)", "summary": "函数沿方向 l 的变化率等于梯度在该方向上的投影；梯度方向是函数增长最快的方向。"}, {"id": "multi-006", "subject": "higher-mathematics", "subjectName": "高等数学", "subjectColor": "#0f6e56", "chapter": "多元函数微分学", "name": "曲面的切平面与法线", "category": "公式", "importance": 4, "tags": ["偏导数", "切平面", "法线"], "latex": "F_x(M_0)(x-x_0)+F_y(M_0)(y-y_0)+F_z(M_0)(z-z_0)=0,\\qquad\\frac{x-x_0}{F_x}=\\frac{y-y_0}{F_y}=\\frac{z-z_0}{F_z}", "summary": "隐式曲面 F(x,y,z)=0 在点 M₀ 处的切平面方程与法线方程，法向量为梯度 ∇F(M₀)。"}, {"id": "multi-007", "subject": "higher-mathematics", "subjectName": "高等数学", "subjectColor": "#0f6e56", "chapter": "多元函数微分学", "name": "多元函数极值的必要与充分条件", "category": "判别法", "importance": 4, "tags": ["极值", "多元函数", "二阶偏导"], "latex": "f_x=f_y=0;\\quad A=f_{xx},\\ B=f_{xy},\\ C=f_{yy}:\\quad AC-B^2>0,\\ A<0\\Rightarrow\\max;\\quad AC-B^2>0,\\ A>0\\Rightarrow\\min", "summary": "驻点处由二阶偏导数构成的判别式 AC−B² 判定极大、极小；小于零时不是极值（鞍点）。"}, {"id": "multi-008", "subject": "higher-mathematics", "subjectName": "高等数学", "subjectColor": "#0f6e56", "chapter": "多元函数微分学", "name": "条件极值与拉格朗日乘数法", "category": "计算", "importance": 5, "tags": ["条件极值", "拉格朗日", "最值"], "latex": "L(x,y,\\lambda)=f(x,y)+\\lambda\\varphi(x,y),\\qquad \\begin{cases}L_x=0\\\\L_y=0\\\\\\varphi(x,y)=0\\end{cases}", "summary": "求 f 在约束 φ=0 下的条件极值时，构造拉格朗日函数并解其驻点方程组。"}, {"id": "multiint-001", "subject": "higher-mathematics", "subjectName": "高等数学", "subjectColor": "#0f6e56", "chapter": "重积分", "name": "二重积分的直角坐标计算", "category": "计算", "importance": 5, "tags": ["二重积分", "直角坐标", "累次积分"], "latex": "\\iint\\limits_D f(x,y)\\,\\mathrm{d}\\sigma=\\int_a^b\\mathrm{d}x\\int_{\\varphi_1(x)}^{\\varphi_2(x)}f(x,y)\\,\\mathrm{d}y", "summary": "把二重积分化为先 y 后 x（或先 x 后 y）的累次积分，关键是确定积分区域的不等式表示。"}, {"id": "multiint-002", "subject": "higher-mathematics", "subjectName": "高等数学", "subjectColor": "#0f6e56", "chapter": "重积分", "name": "二重积分的极坐标计算", "category": "计算", "importance": 5, "tags": ["二重积分", "极坐标", "累次积分"], "latex": "\\iint\\limits_D f(x,y)\\,\\mathrm{d}\\sigma=\\int_{\\alpha}^{\\beta}\\mathrm{d}\\theta\\int_{r_1(\\theta)}^{r_2(\\theta)}f(r\\cos\\theta,r\\sin\\theta)\\,r\\,\\mathrm{d}r", "summary": "当区域与圆、扇形相关或被积函数含 x²+y² 时，改用极坐标，面积元变为 r dr dθ。"}, {"id": "multiint-003", "subject": "higher-mathematics", "subjectName": "高等数学", "subjectColor": "#0f6e56", "chapter": "重积分", "name": "三重积分的直角坐标计算", "category": "计算", "importance": 4, "tags": ["三重积分", "直角坐标", "投影法"], "latex": "\\iiint\\limits_{\\Omega}f(x,y,z)\\,\\mathrm{d}v=\\int_a^b\\mathrm{d}x\\int_{y_1(x)}^{y_2(x)}\\mathrm{d}y\\int_{z_1(x,y)}^{z_2(x,y)}f(x,y,z)\\,\\mathrm{d}z", "summary": "用投影法或截面法把三重积分化为三次累次积分。"}, {"id": "multiint-004", "subject": "higher-mathematics", "subjectName": "高等数学", "subjectColor": "#0f6e56", "chapter": "重积分", "name": "三重积分的柱坐标与球坐标", "category": "计算", "importance": 4, "tags": ["三重积分", "柱坐标", "球坐标"], "latex": "\\iiint\\limits_{\\Omega}f\\,\\mathrm{d}v=\\iiint f(r\\cos\\theta,r\\sin\\theta,z)\\,r\\,\\mathrm{d}r\\mathrm{d}\\theta\\mathrm{d}z=\\iiint f(r\\sin\\varphi\\cos\\theta,\\ldots)\\,r^2\\sin\\varphi\\,\\mathrm{d}r\\mathrm{d}\\varphi\\mathrm{d}\\theta", "summary": "柱坐标体积元为 r dr dθ dz，球坐标体积元为 r² sinφ dr dφ dθ，适用于旋转对称区域。"}, {"id": "multiint-005", "subject": "higher-mathematics", "subjectName": "高等数学", "subjectColor": "#0f6e56", "chapter": "重积分", "name": "重积分的几何应用", "category": "应用", "importance": 3, "tags": ["重积分", "面积", "体积"], "latex": "S=\\iint\\limits_D \\mathrm{d}\\sigma,\\qquad V=\\iiint\\limits_{\\Omega}\\mathrm{d}v=\\iint\\limits_D\\big[z_2(x,y)-z_1(x,y)\\big]\\mathrm{d}\\sigma", "summary": "用二重积分求平面区域面积与曲顶柱体体积，用三重积分求空间立体体积。"}, {"id": "multiint-006", "subject": "higher-mathematics", "subjectName": "高等数学", "subjectColor": "#0f6e56", "chapter": "重积分", "name": "重积分的物理应用（质心）", "category": "应用", "importance": 3, "tags": ["重积分", "质心", "物理应用"], "latex": "\\bar{x}=\\frac{\\iiint_{\\Omega}x\\rho\\,\\mathrm{d}v}{\\iiint_{\\Omega}\\rho\\,\\mathrm{d}v},\\quad \\bar{y}=\\frac{\\iiint_{\\Omega}y\\rho\\,\\mathrm{d}v}{\\iiint_{\\Omega}\\rho\\,\\mathrm{d}v},\\quad \\bar{z}=\\frac{\\iiint_{\\Omega}z\\rho\\,\\mathrm{d}v}{\\iiint_{\\Omega}\\rho\\,\\mathrm{d}v}", "summary": "原书在重积分的应用部分给出质心、转动惯量、引力等物理量的积分表达式。"}, {"id": "curveint-001", "subject": "higher-mathematics", "subjectName": "高等数学", "subjectColor": "#0f6e56", "chapter": "曲线积分与曲面积分", "name": "第一类曲线积分的计算", "category": "计算", "importance": 3, "tags": ["曲线积分", "弧长", "参数化"], "latex": "\\int_L f(x,y)\\,\\mathrm{d}s=\\int_{\\alpha}^{\\beta}f\\big(x(t),y(t)\\big)\\sqrt{x'^2(t)+y'^2(t)}\\,\\mathrm{d}t", "summary": "把第一类曲线积分按弧长微元 ds 化为关于参数的定积分。"}, {"id": "curveint-002", "subject": "higher-mathematics", "subjectName": "高等数学", "subjectColor": "#0f6e56", "chapter": "曲线积分与曲面积分", "name": "格林公式", "category": "定理", "importance": 5, "tags": ["格林公式", "曲线积分", "二重积分"], "latex": "\\oint_L P\\,\\mathrm{d}x+Q\\,\\mathrm{d}y=\\iint\\limits_D\\left(\\frac{\\partial Q}{\\partial x}-\\frac{\\partial P}{\\partial y}\\right)\\mathrm{d}\\sigma", "summary": "把平面闭曲线上的第二类曲线积分化为其所围区域上的二重积分。"}, {"id": "curveint-003", "subject": "higher-mathematics", "subjectName": "高等数学", "subjectColor": "#0f6e56", "chapter": "曲线积分与曲面积分", "name": "曲线积分与路径无关的条件", "category": "定理", "importance": 5, "tags": ["曲线积分", "路径无关", "全微分"], "latex": "\\frac{\\partial P}{\\partial y}=\\frac{\\partial Q}{\\partial x}\\iff\\oint_L P\\,\\mathrm{d}x+Q\\,\\mathrm{d}y=0\\iff\\exists u:\\ \\mathrm{d}u=P\\mathrm{d}x+Q\\mathrm{d}y", "summary": "在单连通区域内，偏导数相等、沿任意闭曲线积分为零、被积式为某函数的全微分，三者等价。"}, {"id": "curveint-004", "subject": "higher-mathematics", "subjectName": "高等数学", "subjectColor": "#0f6e56", "chapter": "曲线积分与曲面积分", "name": "全微分求积", "category": "计算", "importance": 3, "tags": ["全微分", "原函数", "曲线积分"], "latex": "u(x,y)=\\int_{x_0}^{x}P(x,y_0)\\,\\mathrm{d}x+\\int_{y_0}^{y}Q(x,y)\\,\\mathrm{d}y", "summary": "当 P dx+Q dy 为全微分时，选取折线路径积分即可求出原函数 u(x,y)。"}, {"id": "curveint-005", "subject": "higher-mathematics", "subjectName": "高等数学", "subjectColor": "#0f6e56", "chapter": "曲线积分与曲面积分", "name": "高斯公式", "category": "定理", "importance": 5, "tags": ["高斯公式", "曲面积分", "散度"], "latex": "\\iint\\limits_{\\Sigma}P\\,\\mathrm{d}y\\mathrm{d}z+Q\\,\\mathrm{d}z\\mathrm{d}x+R\\,\\mathrm{d}x\\mathrm{d}y=\\iiint\\limits_{\\Omega}\\left(\\frac{\\partial P}{\\partial x}+\\frac{\\partial Q}{\\partial y}+\\frac{\\partial R}{\\partial z}\\right)\\mathrm{d}v", "summary": "把封闭曲面上的第二类曲面积分化为其所围空间区域上的三重积分。"}, {"id": "curveint-006", "subject": "higher-mathematics", "subjectName": "高等数学", "subjectColor": "#0f6e56", "chapter": "曲线积分与曲面积分", "name": "斯托克斯公式", "category": "定理", "importance": 4, "tags": ["斯托克斯公式", "曲线积分", "旋度"], "latex": "\\oint_{\\Gamma}P\\,\\mathrm{d}x+Q\\,\\mathrm{d}y+R\\,\\mathrm{d}z=\\iint\\limits_{\\Sigma}\\begin{vmatrix}\\mathrm{d}y\\mathrm{d}z&\\mathrm{d}z\\mathrm{d}x&\\mathrm{d}x\\mathrm{d}y\\\\\\frac{\\partial}{\\partial x}&\\frac{\\partial}{\\partial y}&\\frac{\\partial}{\\partial z}\\\\P&Q&R\\end{vmatrix}", "summary": "把空间闭曲线上的曲线积分化为以该曲线为边界的曲面上的曲面积分，是格林公式在空间中的推广。"}, {"id": "series-001", "subject": "higher-mathematics", "subjectName": "高等数学", "subjectColor": "#0f6e56", "chapter": "无穷级数", "name": "傅里叶级数展开", "category": "展开式", "importance": 3, "tags": ["傅里叶级数", "级数", "周期函数"], "latex": "f(x)\\sim \\frac{a_0}{2}+\\sum_{n=1}^{\\infty}\\left(a_n\\cos\\frac{n\\pi x}{l}+b_n\\sin\\frac{n\\pi x}{l}\\right)", "summary": "以 2l 为周期的函数可展开为三角级数，系数由积分确定。"}, {"id": "series-002", "subject": "higher-mathematics", "subjectName": "高等数学", "subjectColor": "#0f6e56", "chapter": "无穷级数", "name": "级数收敛的定义与基本性质", "category": "定义", "importance": 4, "tags": ["级数", "部分和", "收敛"], "latex": "\\sum_{n=1}^{\\infty}u_n=S\\iff\\lim_{n\\to\\infty}S_n=S,\\quad S_n=\\sum_{k=1}^{n}u_k;\\qquad\\sum(u_n\\pm v_n)=\\sum u_n\\pm\\sum v_n", "summary": "级数收敛定义为部分和数列存在有限极限；收敛级数可逐项加减，添去有限项不改变敛散性。"}, {"id": "series-003", "subject": "higher-mathematics", "subjectName": "高等数学", "subjectColor": "#0f6e56", "chapter": "无穷级数", "name": "级数收敛的必要条件", "category": "性质", "importance": 4, "tags": ["级数", "收敛", "必要条件"], "latex": "\\sum_{n=1}^{\\infty}u_n\\ \\mathrm{converges}\\Rightarrow\\lim_{n\\to\\infty}u_n=0", "summary": "收敛级数的通项必趋于零。注意这只是必要条件，通项趋于零不能保证级数收敛。"}, {"id": "series-004", "subject": "higher-mathematics", "subjectName": "高等数学", "subjectColor": "#0f6e56", "chapter": "无穷级数", "name": "正项级数的比较判别法", "category": "判别法", "importance": 5, "tags": ["正项级数", "比较判别法"], "latex": "0\\le u_n\\le v_n:\\ \\sum v_n<\\infty\\Rightarrow\\sum u_n<\\infty;\\qquad\\lim_{n\\to\\infty}\\frac{u_n}{v_n}=l\\in(0,+\\infty)\\Rightarrow\\sum u_n\\sim\\sum v_n", "summary": "通过与已知敛散性的正项级数比较（或取比值的极限）判定敛散性。"}, {"id": "series-005", "subject": "higher-mathematics", "subjectName": "高等数学", "subjectColor": "#0f6e56", "chapter": "无穷级数", "name": "正项级数的比值判别法", "category": "判别法", "importance": 5, "tags": ["正项级数", "比值判别法", "达朗贝尔"], "latex": "\\lim_{n\\to\\infty}\\frac{u_{n+1}}{u_n}=\\rho:\\quad \\rho<1\\Rightarrow\\mathrm{convergent},\\quad \\rho>1\\Rightarrow\\mathrm{divergent},\\quad \\rho=1\\Rightarrow\\mathrm{inconclusive}", "summary": "用相邻两项之比的极限判定正项级数敛散性。"}, {"id": "series-006", "subject": "higher-mathematics", "subjectName": "高等数学", "subjectColor": "#0f6e56", "chapter": "无穷级数", "name": "正项级数的根值判别法", "category": "判别法", "importance": 4, "tags": ["正项级数", "根值判别法", "柯西"], "latex": "\\lim_{n\\to\\infty}\\sqrt[n]{u_n}=\\rho:\\quad\\rho<1\\Rightarrow\\mathrm{convergent},\\quad\\rho>1\\Rightarrow\\mathrm{divergent},\\quad\\rho=1\\Rightarrow\\mathrm{inconclusive}", "summary": "把比值判别法中的比值换成 n 次根即得根值判别法，结论与文字叙述均不变。"}, {"id": "series-007", "subject": "higher-mathematics", "subjectName": "高等数学", "subjectColor": "#0f6e56", "chapter": "无穷级数", "name": "交错级数的莱布尼茨判别法", "category": "判别法", "importance": 4, "tags": ["交错级数", "莱布尼茨", "条件收敛"], "latex": "\\sum_{n=1}^{\\infty}(-1)^{n-1}u_n,\\quad u_n\\searrow 0\\Rightarrow\\mathrm{convergent},\\quad |r_n|\\le u_{n+1}", "summary": "若交错级数通项绝对值单调减少且趋于零，则级数收敛，且余项绝对值不超过第一个被舍去项。"}, {"id": "series-008", "subject": "higher-mathematics", "subjectName": "高等数学", "subjectColor": "#0f6e56", "chapter": "无穷级数", "name": "绝对收敛与条件收敛", "category": "定义", "importance": 4, "tags": ["任意项级数", "绝对收敛", "条件收敛"], "latex": "\\sum|u_n|\\ \\mathrm{convergent}\\Rightarrow\\sum u_n\\ \\mathrm{convergent};\\qquad\\sum|u_n|\\ \\mathrm{divergent},\\ \\sum u_n\\ \\mathrm{convergent}\\Rightarrow\\mathrm{conditional}", "summary": "绝对收敛必收敛；自身收敛但取绝对值后发散称为条件收敛。"}, {"id": "series-009", "subject": "higher-mathematics", "subjectName": "高等数学", "subjectColor": "#0f6e56", "chapter": "无穷级数", "name": "幂级数的收敛半径", "category": "计算", "importance": 5, "tags": ["幂级数", "收敛半径", "收敛域"], "latex": "\\sum_{n=0}^{\\infty}a_nx^n:\\quad R=\\lim_{n\\to\\infty}\\left|\\frac{a_n}{a_{n+1}}\\right|=\\frac{1}{\\limsup\\sqrt[n]{|a_n|}}", "summary": "用系数比值（或根值）极限求幂级数的收敛半径，再单独讨论区间端点得到收敛域。"}, {"id": "series-010", "subject": "higher-mathematics", "subjectName": "高等数学", "subjectColor": "#0f6e56", "chapter": "无穷级数", "name": "幂级数的常用展开式", "category": "展开式", "importance": 5, "tags": ["幂级数", "展开式", "麦克劳林级数"], "latex": "\\frac{1}{1-x}=\\sum_{n=0}^{\\infty}x^n,\\quad e^x=\\sum_{n=0}^{\\infty}\\frac{x^n}{n!},\\quad\\sin x=\\sum_{n=0}^{\\infty}\\frac{(-1)^nx^{2n+1}}{(2n+1)!},\\quad\\ln(1+x)=\\sum_{n=1}^{\\infty}\\frac{(-1)^{n-1}x^n}{n}", "summary": "原书在幂级数部分列出七个常用函数的展开式，是把函数展开成幂级数和求级数和的基础。"}, {"id": "series-011", "subject": "higher-mathematics", "subjectName": "高等数学", "subjectColor": "#0f6e56", "chapter": "无穷级数", "name": "周期为 2π 的傅里叶系数", "category": "公式", "importance": 4, "tags": ["傅里叶级数", "傅里叶系数", "三角级数"], "latex": "f(x)\\sim\\frac{a_0}{2}+\\sum_{n=1}^{\\infty}\\big(a_n\\cos nx+b_n\\sin nx\\big),\\quad a_n=\\frac{1}{\\pi}\\int_{-\\pi}^{\\pi}f(x)\\cos nx\\,\\mathrm{d}x,\\quad b_n=\\frac{1}{\\pi}\\int_{-\\pi}^{\\pi}f(x)\\sin nx\\,\\mathrm{d}x", "summary": "周期为 2π 的函数展开为傅里叶级数时，系数由上述积分确定。"}, {"id": "series-012", "subject": "higher-mathematics", "subjectName": "高等数学", "subjectColor": "#0f6e56", "chapter": "无穷级数", "name": "傅里叶级数的收敛定理", "category": "定理", "importance": 4, "tags": ["傅里叶级数", "收敛定理", "狄利克雷"], "latex": "S(x)=\\begin{cases}f(x),&\\mathrm{continuous}\\\\\\frac{1}{2}\\big[f(x^-)+f(x^+)\\big],&\\mathrm{jump}\\end{cases}", "summary": "满足狄利克雷条件（一个周期内连续或只有有限个第一类间断点与有限个极值点）时，傅里叶级数在连续点收敛于 f(x)，在间断点收敛于左右极限的平均值。"}, {"id": "ode-001", "subject": "higher-mathematics", "subjectName": "高等数学", "subjectColor": "#0f6e56", "chapter": "常微分方程", "name": "变量可分离的一阶微分方程", "category": "方程", "importance": 5, "tags": ["微分方程", "可分离变量", "一阶"], "latex": "\\frac{\\mathrm{d}y}{\\mathrm{d}x}=f(x)g(y)\\Rightarrow\\int\\frac{\\mathrm{d}y}{g(y)}=\\int f(x)\\,\\mathrm{d}x+C", "summary": "把含 x 与含 y 的因子分离到等式两边后分别积分即得通解。"}, {"id": "ode-002", "subject": "higher-mathematics", "subjectName": "高等数学", "subjectColor": "#0f6e56", "chapter": "常微分方程", "name": "一阶齐次微分方程", "category": "方程", "importance": 4, "tags": ["微分方程", "齐次方程", "变量代换"], "latex": "\\frac{\\mathrm{d}y}{\\mathrm{d}x}=\\varphi\\!\\left(\\frac{y}{x}\\right),\\quad u=\\frac{y}{x}\\Rightarrow x\\frac{\\mathrm{d}u}{\\mathrm{d}x}=\\varphi(u)-u", "summary": "令 u=y/x 把齐次方程化为变量可分离方程，求解后再回代 u=y/x。"}, {"id": "ode-003", "subject": "higher-mathematics", "subjectName": "高等数学", "subjectColor": "#0f6e56", "chapter": "常微分方程", "name": "一阶线性微分方程的通解", "category": "方程", "importance": 5, "tags": ["微分方程", "一阶线性", "通解公式"], "latex": "y'+P(x)y=Q(x)\\Rightarrow y=e^{-\\int P\\,\\mathrm{d}x}\\left[\\int Q(x)e^{\\int P\\,\\mathrm{d}x}\\mathrm{d}x+C\\right]", "summary": "一阶线性微分方程的通解公式，由积分因子法导出。Q=0 时为齐次方程。"}, {"id": "ode-004", "subject": "higher-mathematics", "subjectName": "高等数学", "subjectColor": "#0f6e56", "chapter": "常微分方程", "name": "伯努利方程", "category": "方程", "importance": 4, "tags": ["微分方程", "伯努利", "变量代换"], "latex": "y'+P(x)y=Q(x)y^n\\ (n\\neq0,1),\\quad z=y^{1-n}\\Rightarrow z'+(1-n)P(x)z=(1-n)Q(x)", "summary": "通过代换 z=y^(1−n) 把伯努利方程化为关于 z 的一阶线性微分方程。"}, {"id": "ode-005", "subject": "higher-mathematics", "subjectName": "高等数学", "subjectColor": "#0f6e56", "chapter": "常微分方程", "name": "可降阶的高阶微分方程", "category": "方程", "importance": 3, "tags": ["微分方程", "可降阶", "高阶"], "latex": "y^{(n)}=f(x)\\Rightarrow y=\\underbrace{\\int\\cdots\\int}_{n}f(x)(\\mathrm{d}x)^n+\\cdots;\\qquad y''=f(x,y')\\xRightarrow{\\ y'=p\\ }p'=f(x,p)", "summary": "原书列出三类可降阶方程：y⁽ⁿ⁾=f(x) 逐次积分；不显含 y 时令 y′=p；不显含 x 时令 y′=p 并以 y 为自变量。"}, {"id": "ode-006", "subject": "higher-mathematics", "subjectName": "高等数学", "subjectColor": "#0f6e56", "chapter": "常微分方程", "name": "线性微分方程解的结构", "category": "定理", "importance": 4, "tags": ["微分方程", "解的结构", "线性"], "latex": "y''+p(x)y'+q(x)y=f(x):\\quad y=C_1y_1+C_2y_2+y^*", "summary": "非齐次方程的通解等于对应齐次方程的通解（两个线性无关解的线性组合）加一个非齐次特解。"}, {"id": "ode-007", "subject": "higher-mathematics", "subjectName": "高等数学", "subjectColor": "#0f6e56", "chapter": "常微分方程", "name": "二阶常系数齐次线性微分方程", "category": "方程", "importance": 5, "tags": ["微分方程", "常系数", "特征方程"], "latex": "y''+py'+qy=0,\\quad \\lambda^2+p\\lambda+q=0:\\quad \\lambda_1\\neq\\lambda_2\\Rightarrow y=C_1e^{\\lambda_1x}+C_2e^{\\lambda_2x};\\quad\\lambda_{1,2}=\\alpha\\pm i\\beta\\Rightarrow y=e^{\\alpha x}(C_1\\cos\\beta x+C_2\\sin\\beta x)", "summary": "由特征方程的根决定通解形式：相异实根、重根、共轭复根三种情形。"}, {"id": "ode-008", "subject": "higher-mathematics", "subjectName": "高等数学", "subjectColor": "#0f6e56", "chapter": "常微分方程", "name": "二阶常系数非齐次线性微分方程", "category": "方程", "importance": 4, "tags": ["微分方程", "非齐次", "待定系数法"], "latex": "y''+py'+qy=e^{\\lambda x}P_m(x)\\Rightarrow y^*=x^k e^{\\lambda x}Q_m(x),\\quad k=\\begin{cases}0,&\\lambda\\ \\mathrm{not\\ a\\ root}\\\\1,&\\lambda\\ \\mathrm{single\\ root}\\\\2,&\\lambda\\ \\mathrm{double\\ root}\\end{cases}", "summary": "自由项为指数函数乘多项式时，用待定系数法设特解；k 由 λ 是否为特征根及其重数决定。"}, {"id": "ode-009", "subject": "higher-mathematics", "subjectName": "高等数学", "subjectColor": "#0f6e56", "chapter": "常微分方程", "name": "欧拉方程", "category": "方程", "importance": 3, "tags": ["微分方程", "欧拉方程", "变量代换"], "latex": "x^2y''+pxy'+qy=f(x),\\quad x=e^t\\Rightarrow\\frac{\\mathrm{d}^2y}{\\mathrm{d}t^2}+(p-1)\\frac{\\mathrm{d}y}{\\mathrm{d}t}+qy=f(e^t)", "summary": "通过代换 x=eᵗ 把变系数的欧拉方程化为常系数线性微分方程。"}, {"id": "ode-010", "subject": "higher-mathematics", "subjectName": "高等数学", "subjectColor": "#0f6e56", "chapter": "常微分方程", "name": "一阶线性差分方程", "category": "方程", "importance": 3, "tags": ["差分方程", "特征方程", "通解"], "latex": "y_{t+1}+ay_t=f(t)\\Rightarrow y_t=C(-a)^t+y_t^*", "summary": "一阶线性差分方程的通解为对应齐次通解与非齐次特解之和；原书分别给出齐次与非齐次情形的解法。"}, {"id": "linear-001", "subject": "linear-algebra", "subjectName": "线性代数", "subjectColor": "#185fa5", "chapter": "行列式", "name": "行列式的性质", "category": "计算", "importance": 5, "tags": ["行列式", "线性代数"], "latex": "|A^{T}|=|A|,\\quad |AB|=|A|\\cdot|B|", "summary": "行列式的转置不变、乘积可拆，是行列式计算与化简的基础性质。"}, {"id": "linear-002", "subject": "linear-algebra", "subjectName": "线性代数", "subjectColor": "#185fa5", "chapter": "行列式", "name": "范德蒙德行列式", "category": "计算", "importance": 4, "tags": ["行列式", "范德蒙德", "特殊行列式"], "latex": "\\begin{vmatrix}1&1&\\cdots&1\\\\x_1&x_2&\\cdots&x_n\\\\x_1^2&x_2^2&\\cdots&x_n^2\\\\\\vdots&\\vdots&\\ddots&\\vdots\\\\x_1^{n-1}&x_2^{n-1}&\\cdots&x_n^{n-1}\\end{vmatrix}=\\prod_{1\\le i<j\\le n}(x_j-x_i)", "summary": "范德蒙德行列式的值等于所有下标对对应元素之差的连乘。"}, {"id": "linear-005", "subject": "linear-algebra", "subjectName": "线性代数", "subjectColor": "#185fa5", "chapter": "行列式", "name": "行列式的定义", "category": "定义", "importance": 4, "tags": ["行列式", "定义", "逆序数"], "latex": "|A|=\\sum_{j_1j_2\\cdots j_n}(-1)^{\\tau(j_1j_2\\cdots j_n)}a_{1j_1}a_{2j_2}\\cdots a_{nj_n}", "summary": "n 阶行列式是取自不同行不同列的 n 个元素乘积的代数和，符号由列标排列的逆序数决定。"}, {"id": "linear-006", "subject": "linear-algebra", "subjectName": "线性代数", "subjectColor": "#185fa5", "chapter": "行列式", "name": "余子式与代数余子式", "category": "定义", "importance": 4, "tags": ["行列式", "余子式", "代数余子式"], "latex": "A_{ij}=(-1)^{i+j}M_{ij}", "summary": "划去第 i 行第 j 列所得 n−1 阶行列式为余子式 Mᵢⱼ，乘以符号 (−1)^(i+j) 得代数余子式。"}, {"id": "linear-007", "subject": "linear-algebra", "subjectName": "线性代数", "subjectColor": "#185fa5", "chapter": "行列式", "name": "行列式按一行（列）展开定理", "category": "定理", "importance": 5, "tags": ["行列式", "展开定理", "代数余子式"], "latex": "|A|=\\sum_{j=1}^{n}a_{ij}A_{ij}\\ (i=1,2,\\ldots,n);\\qquad\\sum_{k=1}^{n}a_{ik}A_{jk}=0\\quad(i\\neq j)", "summary": "行列式等于任一行元素与其代数余子式乘积之和；某一行元素与另一行代数余子式乘积之和为零。"}, {"id": "linear-008", "subject": "linear-algebra", "subjectName": "线性代数", "subjectColor": "#185fa5", "chapter": "行列式", "name": "三角形与对角形行列式", "category": "公式", "importance": 4, "tags": ["行列式", "上三角", "对角"], "latex": "\\begin{vmatrix}a_{11}&a_{12}&\\cdots&a_{1n}\\\\0&a_{22}&\\cdots&a_{2n}\\\\\\vdots&&\\ddots&\\vdots\\\\0&0&\\cdots&a_{nn}\\end{vmatrix}=a_{11}a_{22}\\cdots a_{nn}", "summary": "上（下）三角形行列式与对角形行列式的值等于主对角线上元素的乘积。"}, {"id": "linear-009", "subject": "linear-algebra", "subjectName": "线性代数", "subjectColor": "#185fa5", "chapter": "行列式", "name": "次对角线行列式", "category": "公式", "importance": 3, "tags": ["行列式", "次对角线", "特殊行列式"], "latex": "\\begin{vmatrix}0&\\cdots&0&a_{1n}\\\\0&\\cdots&a_{2,n-1}&0\\\\\\vdots&\\ddots&\\vdots&\\vdots\\\\a_{n1}&\\cdots&0&0\\end{vmatrix}=(-1)^{\\frac{n(n-1)}{2}}a_{1n}a_{2,n-1}\\cdots a_{n1}", "summary": "仅次对角线上元素非零的行列式，其值等于次对角元素之积乘以符号 (−1)^(n(n−1)/2)。"}, {"id": "linear-010", "subject": "linear-algebra", "subjectName": "线性代数", "subjectColor": "#185fa5", "chapter": "行列式", "name": "拉普拉斯展开式", "category": "定理", "importance": 3, "tags": ["行列式", "拉普拉斯", "分块"], "latex": "|A|=\\sum_{1\\le j_1<\\cdots<j_k\\le n}(-1)^{\\sum i_\\alpha+\\sum j_\\beta}\\det A\\begin{pmatrix}i_1\\cdots i_k\\\\j_1\\cdots j_k\\end{pmatrix}\\cdot\\det A\\begin{pmatrix}i_1\\cdots i_k\\\\j_1\\cdots j_k\\end{pmatrix}^{c}", "summary": "取定 k 行，行列式等于这 k 行元素组成的所有 k 阶子式与其代数余子式乘积之和，是按一行展开定理的推广。"}, {"id": "linear-003", "subject": "linear-algebra", "subjectName": "线性代数", "subjectColor": "#185fa5", "chapter": "矩阵", "name": "逆矩阵与伴随矩阵的关系", "category": "计算", "importance": 5, "tags": ["矩阵", "逆矩阵", "伴随矩阵"], "latex": "A^{-1}=\\frac{1}{|A|}\\,A^{*},\\quad A\\,A^{*}=A^{*}A=|A|\\,E", "summary": "可逆矩阵的逆等于伴随矩阵除以行列式，是求逆矩阵的重要方法。"}, {"id": "matrix-001", "subject": "linear-algebra", "subjectName": "线性代数", "subjectColor": "#185fa5", "chapter": "矩阵", "name": "矩阵的加法、数乘与乘法", "category": "公式", "importance": 4, "tags": ["矩阵", "运算", "乘法"], "latex": "(AB)_{ij}=\\sum_{k=1}^{n}a_{ik}b_{kj},\\qquad A_{m\\times n}B_{n\\times p}=C_{m\\times p}", "summary": "矩阵乘法要求左矩阵列数等于右矩阵行数；乘积第 i 行第 j 列元素为对应行与列的内积。"}, {"id": "matrix-002", "subject": "linear-algebra", "subjectName": "线性代数", "subjectColor": "#185fa5", "chapter": "矩阵", "name": "方阵的幂与转置的性质", "category": "性质", "importance": 4, "tags": ["矩阵", "转置", "幂"], "latex": "(A^T)^T=A,\\quad(A+B)^T=A^T+B^T,\\quad(AB)^T=B^TA^T,\\quad(kA)^T=kA^T", "summary": "原书在矩阵运算部分列出的转置运算规律，特别注意乘积转置需反序。"}, {"id": "matrix-003", "subject": "linear-algebra", "subjectName": "线性代数", "subjectColor": "#185fa5", "chapter": "矩阵", "name": "方阵的行列式性质", "category": "性质", "importance": 5, "tags": ["矩阵", "行列式", "乘法"], "latex": "|A^T|=|A|,\\quad|kA|=k^n|A|,\\quad|AB|=|A||B|,\\quad|A^{-1}|=\\frac{1}{|A|}", "summary": "方阵乘积的行列式等于行列式的乘积；A 为 n 阶方阵。"}, {"id": "matrix-004", "subject": "linear-algebra", "subjectName": "线性代数", "subjectColor": "#185fa5", "chapter": "矩阵", "name": "伴随矩阵的性质", "category": "公式", "importance": 5, "tags": ["矩阵", "伴随矩阵", "逆矩阵"], "latex": "AA^*=A^*A=|A|E,\\qquad A^{-1}=\\frac{1}{|A|}A^*,\\qquad (A^*)^{-1}=\\frac{1}{|A|}A", "summary": "伴随矩阵由各元素的代数余子式按转置排列构成；当 |A|≠0 时可用 A* 求逆矩阵。"}, {"id": "matrix-005", "subject": "linear-algebra", "subjectName": "线性代数", "subjectColor": "#185fa5", "chapter": "矩阵", "name": "逆矩阵的定义与性质", "category": "定义", "importance": 5, "tags": ["矩阵", "逆矩阵", "性质"], "latex": "AB=BA=E\\Rightarrow B=A^{-1};\\qquad (AB)^{-1}=B^{-1}A^{-1},\\quad (A^T)^{-1}=(A^{-1})^T", "summary": "满足 AB=BA=E 的矩阵 B 称为 A 的逆矩阵；乘积的逆需反序。"}, {"id": "matrix-006", "subject": "linear-algebra", "subjectName": "线性代数", "subjectColor": "#185fa5", "chapter": "矩阵", "name": "矩阵的秩及其性质", "category": "性质", "importance": 5, "tags": ["矩阵", "秩", "子式"], "latex": "r(A_{m\\times n})\\le\\min\\{m,n\\};\\quad r(AB)\\le\\min\\{r(A),r(B)\\};\\quad r(A^T)=r(A);\\quad r(kA)=r(A)\\ (k\\neq0)", "summary": "矩阵的秩等于其非零子式的最高阶数，也是行（列）向量组的秩。原书列出经过运算后秩的变化规律。"}, {"id": "matrix-007", "subject": "linear-algebra", "subjectName": "线性代数", "subjectColor": "#185fa5", "chapter": "矩阵", "name": "分块矩阵的运算", "category": "公式", "importance": 3, "tags": ["矩阵", "分块矩阵", "运算"], "latex": "\\begin{pmatrix}A&B\\\\C&D\\end{pmatrix}^T=\\begin{pmatrix}A^T&C^T\\\\B^T&D^T\\end{pmatrix},\\qquad\\begin{pmatrix}A_1&O\\\\O&A_2\\end{pmatrix}^{-1}=\\begin{pmatrix}A_1^{-1}&O\\\\O&A_2^{-1}\\end{pmatrix}", "summary": "分块矩阵转置需同时转置各子块并交换位置；分块对角矩阵的行列式与逆可逐块计算。"}, {"id": "matrix-008", "subject": "linear-algebra", "subjectName": "线性代数", "subjectColor": "#185fa5", "chapter": "矩阵", "name": "初等变换与初等矩阵", "category": "定理", "importance": 4, "tags": ["矩阵", "初等变换", "初等矩阵"], "latex": "E_{ij}A\\ \\text{等价于对 }A\\ \\text{作相应初等行变换},\\qquad AE_{ij}\\ \\text{等价于作相应初等列变换}", "summary": "对矩阵作一次初等行（列）变换，等价于左（右）乘相应的初等矩阵；初等矩阵均可逆。"}, {"id": "matrix-009", "subject": "linear-algebra", "subjectName": "线性代数", "subjectColor": "#185fa5", "chapter": "矩阵", "name": "矩阵可逆的充要条件", "category": "定理", "importance": 5, "tags": ["矩阵", "可逆", "充要条件"], "latex": "A\\ \\text{可逆}\\iff |A|\\neq0\\iff r(A)=n\\iff A\\ \\text{可表示为有限个初等矩阵的乘积}", "summary": "n 阶方阵可逆的等价刻画：行列式非零、满秩、行（列）向量组线性无关、可分解为初等矩阵之积。"}, {"id": "matrix-010", "subject": "linear-algebra", "subjectName": "线性代数", "subjectColor": "#185fa5", "chapter": "矩阵", "name": "矩阵等价、相似与合同", "category": "定义", "importance": 4, "tags": ["矩阵", "等价", "相似", "合同"], "latex": "A\\simeq B\\iff B=PAQ;\\qquad A\\sim B\\iff B=P^{-1}AP;\\qquad A\\cong B\\iff B=C^TAC\\quad(P,Q,C\\ \\text{可逆})", "summary": "原书归纳的三种矩阵关系：等价经初等变换得到，相似经可逆矩阵共轭得到，合同经二次型的坐标变换得到。"}, {"id": "la-vector-001", "subject": "linear-algebra", "subjectName": "线性代数", "subjectColor": "#185fa5", "chapter": "向量与向量空间", "name": "线性组合与线性表出", "category": "定义", "importance": 4, "tags": ["向量", "线性组合", "线性表出"], "latex": "\\boldsymbol{\\beta}=k_1\\boldsymbol{\\alpha}_1+k_2\\boldsymbol{\\alpha}_2+\\cdots+k_s\\boldsymbol{\\alpha}_s", "summary": "若存在一组数使 β 可由向量组线性表示，称 β 是该向量组的一个线性组合。"}, {"id": "la-vector-002", "subject": "linear-algebra", "subjectName": "线性代数", "subjectColor": "#185fa5", "chapter": "向量与向量空间", "name": "向量组线性相关的定义", "category": "定义", "importance": 5, "tags": ["向量", "线性相关", "线性无关"], "latex": "k_1\\boldsymbol{\\alpha}_1+\\cdots+k_s\\boldsymbol{\\alpha}_s=\\boldsymbol{0}\\ \\text{有非零解}\\iff\\text{线性相关};\\qquad\\text{仅零解}\\iff\\text{线性无关}", "summary": "齐次线性组合为零向量是否只有零解，是判定向量组线性相关性的定义。"}, {"id": "la-vector-003", "subject": "linear-algebra", "subjectName": "线性代数", "subjectColor": "#185fa5", "chapter": "向量与向量空间", "name": "线性相关性的判定定理", "category": "判别法", "importance": 5, "tags": ["向量", "线性相关", "秩"], "latex": "\\boldsymbol{\\alpha}_1,\\ldots,\\boldsymbol{\\alpha}_s\\ \\text{线性无关}\\iff r(\\boldsymbol{\\alpha}_1,\\ldots,\\boldsymbol{\\alpha}_s)=s;\\qquad s>n\\Rightarrow\\text{必线性相关}", "summary": "把向量组按列排成矩阵，用矩阵的秩判定；向量个数超过维数时必线性相关。"}, {"id": "la-vector-004", "subject": "linear-algebra", "subjectName": "线性代数", "subjectColor": "#185fa5", "chapter": "向量与向量空间", "name": "极大无关组与向量组的秩", "category": "定义", "importance": 5, "tags": ["向量", "极大无关组", "秩"], "latex": "r(\\boldsymbol{\\alpha}_1,\\ldots,\\boldsymbol{\\alpha}_s)=\\ \\text{极大无关组所含向量个数}\\ =r\\big([\\boldsymbol{\\alpha}_1,\\ldots,\\boldsymbol{\\alpha}_s]\\big)", "summary": "向量组的极大线性无关组所含向量个数称为向量组的秩，等于该向量组所成矩阵的秩。"}, {"id": "la-vector-005", "subject": "linear-algebra", "subjectName": "线性代数", "subjectColor": "#185fa5", "chapter": "向量与向量空间", "name": "向量的内积、长度与夹角", "category": "公式", "importance": 4, "tags": ["向量", "内积", "长度", "夹角"], "latex": "(\\boldsymbol{\\alpha},\\boldsymbol{\\beta})=\\sum_{i=1}^{n}a_ib_i=\\boldsymbol{\\alpha}^T\\boldsymbol{\\beta},\\quad\\|\\boldsymbol{\\alpha}\\|=\\sqrt{(\\boldsymbol{\\alpha},\\boldsymbol{\\alpha})},\\quad\\cos\\theta=\\frac{(\\boldsymbol{\\alpha},\\boldsymbol{\\beta})}{\\|\\boldsymbol{\\alpha}\\|\\|\\boldsymbol{\\beta}\\|}", "summary": "n 维向量的内积、长度（范数）与夹角定义；内积为零称两向量正交。"}, {"id": "la-vector-006", "subject": "linear-algebra", "subjectName": "线性代数", "subjectColor": "#185fa5", "chapter": "向量与向量空间", "name": "施密特正交化方法", "category": "计算", "importance": 5, "tags": ["向量", "正交化", "施密特"], "latex": "\\boldsymbol{\\beta}_1=\\boldsymbol{\\alpha}_1,\\quad\\boldsymbol{\\beta}_k=\\boldsymbol{\\alpha}_k-\\sum_{i=1}^{k-1}\\frac{(\\boldsymbol{\\alpha}_k,\\boldsymbol{\\beta}_i)}{(\\boldsymbol{\\beta}_i,\\boldsymbol{\\beta}_i)}\\boldsymbol{\\beta}_i\\quad(k=2,\\ldots,s)", "summary": "把线性无关向量组逐步改造成与之等价的正交向量组，再单位化即得标准正交向量组。"}, {"id": "la-vector-007", "subject": "linear-algebra", "subjectName": "线性代数", "subjectColor": "#185fa5", "chapter": "向量与向量空间", "name": "正交矩阵", "category": "定义", "importance": 4, "tags": ["矩阵", "正交矩阵", "标准正交"], "latex": "A^TA=AA^T=E\\iff A^{-1}=A^T\\iff A\\ \\text{的列（行）向量组为标准正交向量组}", "summary": "满足 AᵀA=E 的实方阵称为正交矩阵，其行列式为 ±1，对应两组标准正交基之间的过渡矩阵。"}, {"id": "la-vector-008", "subject": "linear-algebra", "subjectName": "线性代数", "subjectColor": "#185fa5", "chapter": "向量与向量空间", "name": "基变换与坐标变换", "category": "公式", "importance": 3, "tags": ["向量空间", "基", "过渡矩阵"], "latex": "(\\boldsymbol{\\eta}_1,\\ldots,\\boldsymbol{\\eta}_n)=(\\boldsymbol{\\xi}_1,\\ldots,\\boldsymbol{\\xi}_n)C,\\qquad X=CY", "summary": "两组基之间的过渡矩阵 C 为可逆矩阵；同一向量在两组基下的坐标满足 X=CY。"}, {"id": "la-eq-001", "subject": "linear-algebra", "subjectName": "线性代数", "subjectColor": "#185fa5", "chapter": "线性方程组", "name": "线性方程组的四种表示形式", "category": "定义", "importance": 4, "tags": ["线性方程组", "矩阵表示", "向量表示"], "latex": "\\begin{cases}a_{11}x_1+\\cdots+a_{1n}x_n=b_1\\\\\\vdots\\\\a_{m1}x_1+\\cdots+a_{mn}x_n=b_m\\end{cases}\\iff A\\boldsymbol{x}=\\boldsymbol{b}\\iff x_1\\boldsymbol{\\alpha}_1+\\cdots+x_n\\boldsymbol{\\alpha}_n=\\boldsymbol{b}", "summary": "原书给出线性方程组的一般表示式、Σ 记号表示式、矩阵表示式与向量表示式四种形式。"}, {"id": "la-eq-002", "subject": "linear-algebra", "subjectName": "线性代数", "subjectColor": "#185fa5", "chapter": "线性方程组", "name": "克拉默法则", "category": "定理", "importance": 4, "tags": ["线性方程组", "克拉默法则", "行列式"], "latex": "|A|\\neq0\\Rightarrow x_j=\\frac{|A_j|}{|A|}\\quad(j=1,2,\\ldots,n)", "summary": "系数行列式非零时，方程组有唯一解，解由常数列替换第 j 列所得行列式与系数行列式之商给出。"}, {"id": "la-eq-003", "subject": "linear-algebra", "subjectName": "线性代数", "subjectColor": "#185fa5", "chapter": "线性方程组", "name": "非齐次方程组有解的判别条件", "category": "判别法", "importance": 5, "tags": ["线性方程组", "有解判别", "增广矩阵"], "latex": "A\\boldsymbol{x}=\\boldsymbol{b}\\ \\text{有解}\\iff r(A)=r(A\\,|\\,\\boldsymbol{b});\\quad r(A)=r(\\bar A)=n\\Rightarrow\\text{唯一解};\\quad r(A)=r(\\bar A)<n\\Rightarrow\\text{无穷多解}", "summary": "用系数矩阵与增广矩阵的秩判定非齐次线性方程组解的存在性与唯一性。"}, {"id": "la-eq-004", "subject": "linear-algebra", "subjectName": "线性代数", "subjectColor": "#185fa5", "chapter": "线性方程组", "name": "齐次方程组有非零解的判别条件", "category": "判别法", "importance": 5, "tags": ["线性方程组", "齐次", "非零解"], "latex": "A_{m\\times n}\\boldsymbol{x}=\\boldsymbol{0}\\ \\text{有非零解}\\iff r(A)<n;\\qquad |A|=0\\ (m=n)", "summary": "齐次方程组必有零解；当系数矩阵秩小于未知量个数时存在非零解。方阵情形等价于系数行列式为零。"}, {"id": "la-eq-005", "subject": "linear-algebra", "subjectName": "线性代数", "subjectColor": "#185fa5", "chapter": "线性方程组", "name": "齐次方程组解的结构与基础解系", "category": "定理", "importance": 5, "tags": ["线性方程组", "基础解系", "解空间"], "latex": "\\boldsymbol{x}=c_1\\boldsymbol{\\xi}_1+\\cdots+c_{n-r}\\boldsymbol{\\xi}_{n-r},\\qquad r=r(A),\\ \\dim S=n-r", "summary": "齐次方程组通解为基础解系的任意线性组合，基础解系含 n−r(A) 个线性无关解向量。"}, {"id": "la-eq-006", "subject": "linear-algebra", "subjectName": "线性代数", "subjectColor": "#185fa5", "chapter": "线性方程组", "name": "非齐次方程组解的结构", "category": "定理", "importance": 5, "tags": ["线性方程组", "通解", "特解"], "latex": "\\boldsymbol{x}=\\boldsymbol{\\eta}^*+c_1\\boldsymbol{\\xi}_1+\\cdots+c_{n-r}\\boldsymbol{\\xi}_{n-r}", "summary": "非齐次方程组的通解等于其一个特解加上对应齐次方程组的通解。"}, {"id": "eigen-001", "subject": "linear-algebra", "subjectName": "线性代数", "subjectColor": "#185fa5", "chapter": "矩阵的特征值和特征向量", "name": "特征方程与特征多项式", "category": "定义", "importance": 5, "tags": ["特征值", "特征方程", "特征多项式"], "latex": "|\\lambda E-A|=0\\iff A\\boldsymbol{\\xi}=\\lambda\\boldsymbol{\\xi}\\quad(\\boldsymbol{\\xi}\\neq\\boldsymbol{0})", "summary": "λ 为 A 的特征值当且仅当 |λE−A|=0；对应的非零解向量 ξ 为属于 λ 的特征向量。"}, {"id": "eigen-002", "subject": "linear-algebra", "subjectName": "线性代数", "subjectColor": "#185fa5", "chapter": "矩阵的特征值和特征向量", "name": "特征值的性质", "category": "性质", "importance": 5, "tags": ["特征值", "迹", "行列式"], "latex": "\\sum_{i=1}^{n}\\lambda_i=\\operatorname{tr}(A),\\qquad\\prod_{i=1}^{n}\\lambda_i=|A|", "summary": "全部特征值之和等于矩阵的迹，之积等于矩阵的行列式；A 可逆当且仅当全部特征值非零。"}, {"id": "eigen-003", "subject": "linear-algebra", "subjectName": "线性代数", "subjectColor": "#185fa5", "chapter": "矩阵的特征值和特征向量", "name": "相似矩阵的性质", "category": "性质", "importance": 4, "tags": ["特征值", "相似矩阵", "不变量"], "latex": "B=P^{-1}AP\\Rightarrow |\\lambda E-B|=|\\lambda E-A|,\\quad \\operatorname{tr}(B)=\\operatorname{tr}(A),\\quad |B|=|A|", "summary": "相似矩阵具有相同的特征多项式，因而特征值、迹与行列式都相同。"}, {"id": "eigen-004", "subject": "linear-algebra", "subjectName": "线性代数", "subjectColor": "#185fa5", "chapter": "矩阵的特征值和特征向量", "name": "矩阵可对角化的条件", "category": "判别法", "importance": 5, "tags": ["特征值", "对角化", "线性无关"], "latex": "A\\sim\\Lambda=\\mathrm{diag}(\\lambda_1,\\ldots,\\lambda_n)\\iff A\\ \\text{有}\\ n\\ \\text{个线性无关的特征向量}", "summary": "n 阶方阵可对角化的充要条件是有 n 个线性无关特征向量；有 n 个互异特征值是可对角化的充分条件。"}, {"id": "eigen-005", "subject": "linear-algebra", "subjectName": "线性代数", "subjectColor": "#185fa5", "chapter": "矩阵的特征值和特征向量", "name": "实对称矩阵的特征值性质", "category": "性质", "importance": 4, "tags": ["实对称矩阵", "特征值", "正交"], "latex": "A^T=A\\Rightarrow\\lambda_i\\in\\mathbb{R},\\qquad \\lambda_i\\neq\\lambda_j\\Rightarrow\\boldsymbol{\\xi}_i\\perp\\boldsymbol{\\xi}_j", "summary": "实对称矩阵的特征值全为实数，属于不同特征值的特征向量彼此正交。"}, {"id": "linear-004", "subject": "linear-algebra", "subjectName": "线性代数", "subjectColor": "#185fa5", "chapter": "矩阵的特征值和特征向量", "name": "特征值与特征向量的定义", "category": "计算", "importance": 5, "tags": ["特征值", "特征向量", "对角化"], "latex": "A\\alpha=\\lambda\\alpha,\\quad \\alpha\\neq 0", "summary": "满足 Aα=λα 的非零向量 α 是特征向量，λ 是对应的特征值。"}, {"id": "quad-001", "subject": "linear-algebra", "subjectName": "线性代数", "subjectColor": "#185fa5", "chapter": "二次型", "name": "二次型的定义与矩阵表示", "category": "定义", "importance": 4, "tags": ["二次型", "矩阵表示", "实对称"], "latex": "f(x_1,\\ldots,x_n)=\\boldsymbol{x}^TA\\boldsymbol{x}=\\sum_{i,j=1}^{n}a_{ij}x_ix_j,\\qquad A^T=A", "summary": "二次型可唯一地用实对称矩阵 A 表示，A 称为二次型的矩阵，其秩称为二次型的秩。"}, {"id": "quad-002", "subject": "linear-algebra", "subjectName": "线性代数", "subjectColor": "#185fa5", "chapter": "二次型", "name": "二次型的标准形与规范形", "category": "定义", "importance": 4, "tags": ["二次型", "标准形", "规范形"], "latex": "f\\xlongequal{\\ \\boldsymbol{x}=C\\boldsymbol{y}\\ }d_1y_1^2+\\cdots+d_ny_n^2\\ \\xrightarrow{\\ \\text{规范}\\ }\\ z_1^2+\\cdots+z_p^2-z_{p+1}^2-\\cdots-z_{r}^2", "summary": "经可逆线性变换把二次型化为只含平方项的标准形，再归一化系数得规范形。"}, {"id": "quad-003", "subject": "linear-algebra", "subjectName": "线性代数", "subjectColor": "#185fa5", "chapter": "二次型", "name": "惯性定理", "category": "定理", "importance": 4, "tags": ["二次型", "惯性定理", "正负惯性指数"], "latex": "p+q=r(A),\\qquad p,\\ q\\ \\text{与所选可逆线性变换无关}", "summary": "二次型的正、负惯性指数（正、负平方项个数）由原二次型唯一确定，与所用的可逆坐标变换无关。"}, {"id": "quad-004", "subject": "linear-algebra", "subjectName": "线性代数", "subjectColor": "#185fa5", "chapter": "二次型", "name": "用配方法化二次型为标准形", "category": "计算", "importance": 3, "tags": ["二次型", "配方法", "标准形"], "latex": "f=\\sum_{i,j}a_{ij}x_ix_j\\xrightarrow{\\ \\text{逐项配方}\\ }\\sum_{k}d_ky_k^2,\\qquad \\boldsymbol{y}=C^{-1}\\boldsymbol{x}", "summary": "通过逐个变量配方消去交叉项，得到标准形与所用可逆线性变换。"}, {"id": "quad-005", "subject": "linear-algebra", "subjectName": "线性代数", "subjectColor": "#185fa5", "chapter": "二次型", "name": "用正交变换化实二次型为标准形", "category": "计算", "importance": 5, "tags": ["二次型", "正交变换", "特征值"], "latex": "Q^TAQ=\\Lambda=\\mathrm{diag}(\\lambda_1,\\ldots,\\lambda_n),\\qquad \\boldsymbol{x}=Q\\boldsymbol{y}\\Rightarrow f=\\sum_{i=1}^{n}\\lambda_iy_i^2", "summary": "求出实对称矩阵 A 的特征值并构造正交矩阵 Q，用正交变换 x=Qy 把二次型化为以特征值为系数的标准形。"}, {"id": "quad-006", "subject": "linear-algebra", "subjectName": "线性代数", "subjectColor": "#185fa5", "chapter": "二次型", "name": "正定二次型的判定", "category": "判别法", "importance": 5, "tags": ["二次型", "正定", "顺序主子式"], "latex": "f>0\\ (\\forall\\boldsymbol{x}\\neq\\boldsymbol{0})\\iff p=n\\iff\\lambda_i>0\\ (\\forall i)\\iff\\Delta_1>0,\\Delta_2>0,\\ldots,\\Delta_n>0", "summary": "二次型正定的等价条件：正惯性指数为 n、全部特征值为正、各阶顺序主子式全为正（霍尔维茨定理）。"}, {"id": "prob-001", "subject": "probability-statistics", "subjectName": "概率论与数理统计", "subjectColor": "#534ab7", "chapter": "随机事件与概率", "name": "全概率公式", "category": "公式", "importance": 5, "tags": ["全概率公式", "条件概率", "完备事件组"], "latex": "P(B)=\\sum_{i}P(A_i)\\,P(B\\mid A_i)", "summary": "把复杂事件的概率分解为若干完备子事件下的条件概率加权和。"}, {"id": "prob-002", "subject": "probability-statistics", "subjectName": "概率论与数理统计", "subjectColor": "#534ab7", "chapter": "随机事件与概率", "name": "贝叶斯公式", "category": "公式", "importance": 5, "tags": ["贝叶斯公式", "条件概率", "后验概率"], "latex": "P(A_i\\mid B)=\\frac{P(A_i)\\,P(B\\mid A_i)}{\\sum_{j}P(A_j)\\,P(B\\mid A_j)}", "summary": "已知结果求原因的概率，由先验概率反推后验概率。"}, {"id": "prob-006", "subject": "probability-statistics", "subjectName": "概率论与数理统计", "subjectColor": "#534ab7", "chapter": "随机事件与概率", "name": "事件运算的规律", "category": "性质", "importance": 4, "tags": ["事件", "运算律", "对偶律"], "latex": "A\\cup B=B\\cup A,\\quad A\\cap(B\\cup C)=(A\\cap B)\\cup(A\\cap C),\\quad \\overline{A\\cup B}=\\bar A\\cap\\bar B,\\quad \\overline{A\\cap B}=\\bar A\\cup\\bar B", "summary": "事件运算满足交换律、结合律、分配律与对偶律（德摩根律），是化简复杂事件的基础。"}, {"id": "prob-007", "subject": "probability-statistics", "subjectName": "概率论与数理统计", "subjectColor": "#534ab7", "chapter": "随机事件与概率", "name": "概率的基本性质", "category": "性质", "importance": 4, "tags": ["概率", "公理", "性质"], "latex": "P(\\Omega)=1,\\quad 0\\le P(A)\\le1,\\quad P(\\varnothing)=0,\\quad P(\\bar A)=1-P(A),\\quad P(A-B)=P(A)-P(AB)", "summary": "由概率的规范性、非负性与可列可加性推出的一组基本性质，含对立事件与差事件的概率。"}, {"id": "prob-008", "subject": "probability-statistics", "subjectName": "概率论与数理统计", "subjectColor": "#534ab7", "chapter": "随机事件与概率", "name": "概率的加法公式", "category": "公式", "importance": 5, "tags": ["概率", "加法公式", "容斥"], "latex": "P(A\\cup B)=P(A)+P(B)-P(AB),\\qquad P\\Big(\\bigcup_{i=1}^{n}A_i\\Big)=\\sum_i P(A_i)-\\sum_{i<j}P(A_iA_j)+\\cdots", "summary": "两个（或任意有限个）事件和的概率由容斥原理给出；两两互不相容时直接相加。"}, {"id": "prob-009", "subject": "probability-statistics", "subjectName": "概率论与数理统计", "subjectColor": "#534ab7", "chapter": "随机事件与概率", "name": "古典概型与几何概型", "category": "公式", "importance": 4, "tags": ["古典概型", "几何概型", "概率"], "latex": "P(A)=\\frac{n_A}{n_{\\Omega}}=\\frac{A\\ \\mathrm{包含的样本点数}}{\\Omega\\ \\mathrm{中样本点总数}},\\qquad P(A)=\\frac{\\mu(A)}{\\mu(\\Omega)}", "summary": "古典概型要求样本点有限且等可能；几何概型把等可能性推广到几何区域上的度量之比。"}, {"id": "prob-010", "subject": "probability-statistics", "subjectName": "概率论与数理统计", "subjectColor": "#534ab7", "chapter": "随机事件与概率", "name": "条件概率与乘法公式", "category": "公式", "importance": 5, "tags": ["条件概率", "乘法公式", "独立性"], "latex": "P(B\\,|\\,A)=\\frac{P(AB)}{P(A)}\\ (P(A)>0),\\qquad P(AB)=P(A)P(B\\,|\\,A)", "summary": "在 A 已发生的条件下 B 发生的概率为条件概率；由此可得乘法公式，并推广到多个事件。"}, {"id": "prob-011", "subject": "probability-statistics", "subjectName": "概率论与数理统计", "subjectColor": "#534ab7", "chapter": "随机事件与概率", "name": "事件的独立性", "category": "定义", "importance": 5, "tags": ["独立性", "事件", "乘法公式"], "latex": "A\\perp B\\iff P(AB)=P(A)P(B);\\qquad A_1,\\ldots,A_n\\ \\text{相互独立}\\iff P\\Big(\\bigcap_{i\\in I}A_i\\Big)=\\prod_{i\\in I}P(A_i)", "summary": "两事件独立等价于积事件概率等于概率之积；多个事件相互独立要求对任意子集都成立。"}, {"id": "prob-012", "subject": "probability-statistics", "subjectName": "概率论与数理统计", "subjectColor": "#534ab7", "chapter": "随机事件与概率", "name": "n 重伯努利试验", "category": "公式", "importance": 5, "tags": ["伯努利试验", "二项概率", "独立重复"], "latex": "P\\{X=k\\}=\\binom{n}{k}p^k(1-p)^{n-k},\\qquad k=0,1,\\ldots,n", "summary": "在 n 次独立重复试验中事件 A 恰好发生 k 次的概率，其中每次试验 P(A)=p。"}, {"id": "prob-013", "subject": "probability-statistics", "subjectName": "概率论与数理统计", "subjectColor": "#534ab7", "chapter": "一维随机变量及其分布", "name": "分布函数的定义与性质", "category": "定义", "importance": 5, "tags": ["分布函数", "定义", "性质"], "latex": "F(x)=P\\{X\\le x\\},\\quad 0\\le F(x)\\le1,\\quad F(-\\infty)=0,\\ F(+\\infty)=1,\\quad F\\ \\text{单调不减且右连续}", "summary": "分布函数完整刻画随机变量的概率分布；原书列出单调性、有界性、右连续性与极限值等性质。"}, {"id": "prob-014", "subject": "probability-statistics", "subjectName": "概率论与数理统计", "subjectColor": "#534ab7", "chapter": "一维随机变量及其分布", "name": "离散型随机变量的分布律", "category": "定义", "importance": 5, "tags": ["离散型", "分布律", "概率"], "latex": "P\\{X=x_i\\}=p_i\\ (i=1,2,\\ldots),\\qquad p_i\\ge0,\\quad\\sum_{i}p_i=1", "summary": "离散型随机变量由分布律（概率质量函数）刻画，所有取值概率非负且总和为 1。"}, {"id": "prob-015", "subject": "probability-statistics", "subjectName": "概率论与数理统计", "subjectColor": "#534ab7", "chapter": "一维随机变量及其分布", "name": "连续型随机变量与概率密度", "category": "定义", "importance": 5, "tags": ["连续型", "概率密度", "分布函数"], "latex": "F(x)=\\int_{-\\infty}^{x}f(t)\\,\\mathrm{d}t,\\qquad f(x)\\ge0,\\quad\\int_{-\\infty}^{+\\infty}f(x)\\,\\mathrm{d}x=1", "summary": "存在非负可积函数 f(x) 使分布函数可表示为积分时，称 X 为连续型随机变量，f 为概率密度。"}, {"id": "prob-016", "subject": "probability-statistics", "subjectName": "概率论与数理统计", "subjectColor": "#534ab7", "chapter": "一维随机变量及其分布", "name": "概率密度与分布函数的关系", "category": "公式", "importance": 4, "tags": ["概率密度", "分布函数", "积分"], "latex": "P\\{a<X\\le b\\}=\\int_a^b f(x)\\,\\mathrm{d}x=F(b)-F(a),\\qquad F'(x)=f(x)\\ (\\text{在 }f\\ \\text{的连续点})", "summary": "由概率密度积分可求任意区间的概率；在密度连续点处，分布函数的导数即为密度。"}, {"id": "prob-017", "subject": "probability-statistics", "subjectName": "概率论与数理统计", "subjectColor": "#534ab7", "chapter": "一维随机变量及其分布", "name": "随机变量函数的分布", "category": "计算", "importance": 4, "tags": ["随机变量函数", "分布", "变量代换"], "latex": "Y=g(X):\\quad P\\{Y=y_j\\}=\\sum_{g(x_i)=y_j}P\\{X=x_i\\};\\qquad f_Y(y)=f_X\\big(h(y)\\big)\\,|h'(y)|", "summary": "离散型直接按取值合并概率；连续型在 g 单调可导时用变量代换公式求密度。"}, {"id": "prob-018", "subject": "probability-statistics", "subjectName": "概率论与数理统计", "subjectColor": "#534ab7", "chapter": "二维随机变量及其分布", "name": "二维联合分布函数", "category": "定义", "importance": 4, "tags": ["二维随机变量", "联合分布函数"], "latex": "F(x,y)=P\\{X\\le x,\\ Y\\le y\\},\\qquad F(x,-\\infty)=F(-\\infty,y)=0,\\quad F(+\\infty,+\\infty)=1", "summary": "二维随机变量 (X,Y) 的联合分布函数及其基本性质，关于 x、y 分别单调不减且右连续。"}, {"id": "prob-019", "subject": "probability-statistics", "subjectName": "概率论与数理统计", "subjectColor": "#534ab7", "chapter": "二维随机变量及其分布", "name": "联合分布律与边缘分布律", "category": "公式", "importance": 4, "tags": ["二维离散型", "联合分布律", "边缘分布"], "latex": "P\\{X=x_i,Y=y_j\\}=p_{ij},\\quad \\sum_{i,j}p_{ij}=1;\\qquad p_{i\\,\\cdot}=\\sum_j p_{ij},\\quad p_{\\cdot\\,j}=\\sum_i p_{ij}", "summary": "二维离散型随机变量的联合分布律及对其余变量求和所得的两个边缘分布律。"}, {"id": "prob-020", "subject": "probability-statistics", "subjectName": "概率论与数理统计", "subjectColor": "#534ab7", "chapter": "二维随机变量及其分布", "name": "联合概率密度与边缘密度", "category": "公式", "importance": 5, "tags": ["二维连续型", "联合密度", "边缘密度"], "latex": "F(x,y)=\\int_{-\\infty}^{x}\\int_{-\\infty}^{y}f(u,v)\\,\\mathrm{d}v\\mathrm{d}u,\\quad f_X(x)=\\int_{-\\infty}^{+\\infty}f(x,y)\\,\\mathrm{d}y,\\quad f_Y(y)=\\int_{-\\infty}^{+\\infty}f(x,y)\\,\\mathrm{d}x", "summary": "二维连续型随机变量由联合概率密度刻画，对其中一个变量积分得到相应的边缘密度。"}, {"id": "prob-021", "subject": "probability-statistics", "subjectName": "概率论与数理统计", "subjectColor": "#534ab7", "chapter": "二维随机变量及其分布", "name": "条件分布", "category": "公式", "importance": 3, "tags": ["条件分布", "条件密度", "二维"], "latex": "P\\{X=x_i\\,|\\,Y=y_j\\}=\\frac{p_{ij}}{p_{\\cdot j}},\\qquad f_{X|Y}(x\\,|\\,y)=\\frac{f(x,y)}{f_Y(y)}\\ (f_Y(y)>0)", "summary": "在给定另一个变量取值条件下的分布律或概率密度。"}, {"id": "prob-022", "subject": "probability-statistics", "subjectName": "概率论与数理统计", "subjectColor": "#534ab7", "chapter": "二维随机变量及其分布", "name": "随机变量的独立性", "category": "判别法", "importance": 5, "tags": ["独立性", "随机变量", "联合分布"], "latex": "X\\perp Y\\iff F(x,y)=F_X(x)F_Y(y)\\iff f(x,y)=f_X(x)f_Y(y)\\ (\\mathrm{a.e.})", "summary": "二维随机变量独立的定义及用联合分布、边缘分布（密度、分布律）判别的等价条件。"}, {"id": "prob-023", "subject": "probability-statistics", "subjectName": "概率论与数理统计", "subjectColor": "#534ab7", "chapter": "二维随机变量及其分布", "name": "二维均匀分布与二维正态分布", "category": "分布", "importance": 3, "tags": ["二维均匀分布", "二维正态分布"], "latex": "f(x,y)=\\begin{cases}\\frac{1}{S_D},&(x,y)\\in D\\\\0,&\\text{otherwise}\\end{cases};\\qquad f(x,y)=\\frac{1}{2\\pi\\sigma_1\\sigma_2\\sqrt{1-\\rho^2}}\\exp\\Big\\{-\\frac{1}{2(1-\\rho^2)}\\Big[\\frac{(x-\\mu_1)^2}{\\sigma_1^2}-\\frac{2\\rho(x-\\mu_1)(y-\\mu_2)}{\\sigma_1\\sigma_2}+\\frac{(y-\\mu_2)^2}{\\sigma_2^2}\\Big]\\Big\\}", "summary": "原书在二维常见分布部分列出二维均匀分布与二维正态分布的联合概率密度。"}, {"id": "prob-024", "subject": "probability-statistics", "subjectName": "概率论与数理统计", "subjectColor": "#534ab7", "chapter": "二维随机变量及其分布", "name": "Z=X+Y 的卷积公式", "category": "公式", "importance": 4, "tags": ["卷积公式", "函数和", "分布"], "latex": "f_Z(z)=\\int_{-\\infty}^{+\\infty}f(x,z-x)\\,\\mathrm{d}x=\\int_{-\\infty}^{+\\infty}f_X(x)f_Y(z-x)\\,\\mathrm{d}x\\quad(X\\perp Y)", "summary": "两个独立随机变量之和的密度由卷积给出；离散型对应卷积和 P{Z=k}=Σ P{X=i}P{Y=k−i}。"}, {"id": "prob-025", "subject": "probability-statistics", "subjectName": "概率论与数理统计", "subjectColor": "#534ab7", "chapter": "二维随机变量及其分布", "name": "最大值与最小值的分布", "category": "公式", "importance": 3, "tags": ["最大值", "最小值", "分布"], "latex": "F_{\\max}(z)=F_X(z)F_Y(z),\\qquad F_{\\min}(z)=1-[1-F_X(z)][1-F_Y(z)]\\quad(X\\perp Y)", "summary": "独立随机变量最大值 M=max(X,Y) 与最小值 N=min(X,Y) 的分布函数。"}, {"id": "prob-003", "subject": "probability-statistics", "subjectName": "概率论与数理统计", "subjectColor": "#534ab7", "chapter": "随机变量的数字特征", "name": "数学期望的定义", "category": "公式", "importance": 5, "tags": ["数学期望", "数字特征"], "latex": "EX=\\begin{cases}\\displaystyle\\sum_i x_i\\,p_i, & \\text{离散型}\\\\[6pt]\\displaystyle\\int_{-\\infty}^{+\\infty}x\\,f(x)\\,dx, & \\text{连续型}\\end{cases}", "summary": "数学期望是随机变量取值的加权平均，离散型求和、连续型积分。"}, {"id": "prob-004", "subject": "probability-statistics", "subjectName": "概率论与数理统计", "subjectColor": "#534ab7", "chapter": "随机变量的数字特征", "name": "方差与协方差", "category": "公式", "importance": 5, "tags": ["方差", "协方差", "数字特征"], "latex": "DX=E(X-EX)^2=E(X^2)-(EX)^2,\\quad \\mathrm{Cov}(X,Y)=E[(X-EX)(Y-EY)]", "summary": "方差度量随机变量偏离期望的程度；协方差度量两变量的线性相关程度。"}, {"id": "prob-026", "subject": "probability-statistics", "subjectName": "概率论与数理统计", "subjectColor": "#534ab7", "chapter": "随机变量的数字特征", "name": "随机变量函数的期望公式", "category": "公式", "importance": 5, "tags": ["期望", "函数期望", "求和积分"], "latex": "E[g(X)]=\\begin{cases}\\sum_i g(x_i)p_i,&\\text{离散型}\\\\\\int_{-\\infty}^{+\\infty}g(x)f(x)\\,\\mathrm{d}x,&\\text{连续型}\\end{cases}", "summary": "求随机变量函数的期望无需先求 Y=g(X) 的分布，直接对原分布加权求和（积分）即可。"}, {"id": "prob-027", "subject": "probability-statistics", "subjectName": "概率论与数理统计", "subjectColor": "#534ab7", "chapter": "随机变量的数字特征", "name": "数学期望的性质", "category": "性质", "importance": 4, "tags": ["期望", "线性性质", "独立性"], "latex": "E(C)=C,\\quad E(aX+bY)=aE(X)+bE(Y),\\quad E(XY)=E(X)E(Y)\\ (X\\perp Y)", "summary": "期望的线性性质不要求独立；乘积的期望等于期望之积则需 X 与 Y 独立。"}, {"id": "prob-028", "subject": "probability-statistics", "subjectName": "概率论与数理统计", "subjectColor": "#534ab7", "chapter": "随机变量的数字特征", "name": "方差的计算公式与性质", "category": "公式", "importance": 5, "tags": ["方差", "计算公式", "性质"], "latex": "D(X)=E\\big[(X-EX)^2\\big]=E(X^2)-[E(X)]^2,\\qquad D(aX+b)=a^2D(X),\\quad D(X\\pm Y)=D(X)+D(Y)\\ (X\\perp Y)", "summary": "方差衡量随机变量取值的离散程度，常用 E(X²)−[E(X)]² 计算。"}, {"id": "prob-029", "subject": "probability-statistics", "subjectName": "概率论与数理统计", "subjectColor": "#534ab7", "chapter": "随机变量的数字特征", "name": "协方差与相关系数", "category": "公式", "importance": 5, "tags": ["协方差", "相关系数", "不相关"], "latex": "\\operatorname{Cov}(X,Y)=E(XY)-E(X)E(Y),\\qquad \\rho_{XY}=\\frac{\\operatorname{Cov}(X,Y)}{\\sqrt{D(X)}\\sqrt{D(Y)}},\\qquad |\\rho_{XY}|\\le1", "summary": "协方差与相关系数刻画两个随机变量的线性相关程度；ρ=0 称不相关。"}, {"id": "prob-030", "subject": "probability-statistics", "subjectName": "概率论与数理统计", "subjectColor": "#534ab7", "chapter": "随机变量的数字特征", "name": "常见分布的数字特征", "category": "公式", "importance": 4, "tags": ["数字特征", "常见分布", "期望方差"], "latex": "X\\sim B(n,p):\\ EX=np,\\ DX=np(1-p);\\qquad X\\sim P(\\lambda):\\ EX=DX=\\lambda;\\qquad X\\sim N(\\mu,\\sigma^2):\\ EX=\\mu,\\ DX=\\sigma^2", "summary": "原书在数字特征部分汇总的常见分布期望与方差，是解题时最常用的查表结论。"}, {"id": "prob-005", "subject": "probability-statistics", "subjectName": "概率论与数理统计", "subjectColor": "#534ab7", "chapter": "常用分布", "name": "二项分布", "category": "分布", "importance": 4, "tags": ["二项分布", "伯努利试验", "常用分布"], "latex": "P(X=k)=C_n^{k}\\,p^{k}(1-p)^{n-k},\\quad k=0,1,2,\\ldots,n", "summary": "n 重伯努利试验中事件恰好发生 k 次的概率。"}, {"id": "prob-031", "subject": "probability-statistics", "subjectName": "概率论与数理统计", "subjectColor": "#534ab7", "chapter": "常用分布", "name": "0-1 分布（伯努利分布）", "category": "分布", "importance": 4, "tags": ["0-1分布", "伯努利", "分布律"], "latex": "P\\{X=k\\}=p^k(1-p)^{1-k},\\quad k=0,1;\\qquad EX=p,\\ DX=p(1-p)", "summary": "一次伯努利试验中事件 A 发生次数的分布，是二项分布 n=1 的特例。"}, {"id": "prob-032", "subject": "probability-statistics", "subjectName": "概率论与数理统计", "subjectColor": "#534ab7", "chapter": "常用分布", "name": "泊松分布", "category": "分布", "importance": 5, "tags": ["泊松分布", "分布律", "数字特征"], "latex": "X\\sim P(\\lambda):\\quad P\\{X=k\\}=\\frac{\\lambda^k}{k!}e^{-\\lambda},\\ k=0,1,2,\\ldots;\\qquad EX=DX=\\lambda", "summary": "描述单位时间（空间）内稀有事件发生次数的分布；当 n 大 p 小时可近似二项分布。"}, {"id": "prob-033", "subject": "probability-statistics", "subjectName": "概率论与数理统计", "subjectColor": "#534ab7", "chapter": "常用分布", "name": "均匀分布", "category": "分布", "importance": 4, "tags": ["均匀分布", "概率密度", "数字特征"], "latex": "X\\sim U(a,b):\\quad f(x)=\\begin{cases}\\frac{1}{b-a},&a<x<b\\\\0,&\\text{otherwise}\\end{cases};\\qquad EX=\\frac{a+b}{2},\\ DX=\\frac{(b-a)^2}{12}", "summary": "在区间 (a,b) 上密度为常数的连续型分布。"}, {"id": "prob-034", "subject": "probability-statistics", "subjectName": "概率论与数理统计", "subjectColor": "#534ab7", "chapter": "常用分布", "name": "指数分布", "category": "分布", "importance": 4, "tags": ["指数分布", "无记忆性", "数字特征"], "latex": "X\\sim E(\\lambda):\\quad f(x)=\\begin{cases}\\lambda e^{-\\lambda x},&x>0\\\\0,&x\\le0\\end{cases};\\qquad EX=\\frac{1}{\\lambda},\\ DX=\\frac{1}{\\lambda^2}", "summary": "常用于描述寿命、等待时间的分布，具有无记忆性。"}, {"id": "prob-035", "subject": "probability-statistics", "subjectName": "概率论与数理统计", "subjectColor": "#534ab7", "chapter": "常用分布", "name": "正态分布与标准化", "category": "分布", "importance": 5, "tags": ["正态分布", "标准化", "3σ"], "latex": "X\\sim N(\\mu,\\sigma^2):\\quad f(x)=\\frac{1}{\\sqrt{2\\pi}\\sigma}e^{-\\frac{(x-\\mu)^2}{2\\sigma^2}},\\qquad \\frac{X-\\mu}{\\sigma}\\sim N(0,1),\\quad P\\{|X-\\mu|<3\\sigma\\}\\approx0.9973", "summary": "正态分布的密度、标准化变换与常用 3σ 结论；标准正态分布函数记为 Φ(x)。"}, {"id": "prob-036", "subject": "probability-statistics", "subjectName": "概率论与数理统计", "subjectColor": "#534ab7", "chapter": "常用分布", "name": "几何分布与超几何分布", "category": "分布", "importance": 3, "tags": ["几何分布", "超几何分布", "分布律"], "latex": "P\\{X=k\\}=(1-p)^{k-1}p\\ (k=1,2,\\ldots);\\qquad P\\{X=k\\}=\\frac{\\binom{M}{k}\\binom{N-M}{n-k}}{\\binom{N}{n}}", "summary": "几何分布描述首次成功所需试验次数；超几何分布描述不放回抽样中的成功个数。"}, {"id": "prob-037", "subject": "probability-statistics", "subjectName": "概率论与数理统计", "subjectColor": "#534ab7", "chapter": "大数定律与中心极限定理", "name": "切比雪夫不等式", "category": "定理", "importance": 5, "tags": ["切比雪夫不等式", "方差", "估计"], "latex": "P\\{|X-EX|\\ge\\varepsilon\\}\\le\\frac{D(X)}{\\varepsilon^2}\\quad(\\varepsilon>0),\\qquad P\\{|X-EX|<\\varepsilon\\}\\ge1-\\frac{D(X)}{\\varepsilon^2}", "summary": "用期望与方差给出随机变量偏离其期望的概率上界，是证明大数定律的工具。"}, {"id": "prob-038", "subject": "probability-statistics", "subjectName": "概率论与数理统计", "subjectColor": "#534ab7", "chapter": "大数定律与中心极限定理", "name": "切比雪夫大数定律与辛钦大数定律", "category": "定理", "importance": 4, "tags": ["大数定律", "依概率收敛", "独立同分布"], "latex": "\\lim_{n\\to\\infty}P\\left\\{\\left|\\frac{1}{n}\\sum_{i=1}^{n}X_i-\\frac{1}{n}\\sum_{i=1}^{n}E(X_i)\\right|<\\varepsilon\\right\\}=1", "summary": "相互独立（或独立同分布）且方差有界的随机变量序列，其算术平均依概率收敛于期望的算术平均。"}, {"id": "prob-039", "subject": "probability-statistics", "subjectName": "概率论与数理统计", "subjectColor": "#534ab7", "chapter": "大数定律与中心极限定理", "name": "伯努利大数定律", "category": "定理", "importance": 4, "tags": ["大数定律", "频率", "伯努利"], "latex": "\\lim_{n\\to\\infty}P\\left\\{\\left|\\frac{n_A}{n}-p\\right|<\\varepsilon\\right\\}=1", "summary": "n 次独立重复试验中事件 A 发生的频率依概率收敛于其概率 p，是频率稳定性的理论依据。"}, {"id": "prob-040", "subject": "probability-statistics", "subjectName": "概率论与数理统计", "subjectColor": "#53
